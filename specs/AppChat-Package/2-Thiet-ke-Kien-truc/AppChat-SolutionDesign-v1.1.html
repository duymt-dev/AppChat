document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

úp một người có thể xây dựng, vận hành và phát triển doanh nghiệp trên một hệ thống duy nhất. Thay vì buộc nhân viên thao tác thủ công qua hàng chục màn hình, AppChat cho phép giao việc và thực thi nghiệp vụ qua hội thoại với trợ lý AI, đồng thời để các AI Agent tự động xử lý phần lớn tương tác lặp lại — có con người giám sát ở các điểm quyết định.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 14px\" class=\"keep\">\n  <div style=\"border:1px solid #CDEBD9;background:#F6FBF8;border-radius:11px;padding:15px\"><div style=\"font-size:22px;font-weight:800;color:#157A40\">17<\u002Fdiv><div style=\"font-size:12px;color:#5A6470;margin-top:2px;line-height:1.4\">module nghiệp vụ trên một nền tảng<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #CDEBD9;background:#F6FBF8;border-radius:11px;padding:15px\"><div style=\"font-size:22px;font-weight:800;color:#157A40\">15+<\u002Fdiv><div style=\"font-size:12px;color:#5A6470;margin-top:2px;line-height:1.4\">kênh kết nối khách hàng<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #CDEBD9;background:#F6FBF8;border-radius:11px;padding:15px\"><div style=\"font-size:22px;font-weight:800;color:#157A40\">4+1<\u002Fdiv><div style=\"font-size:12px;color:#5A6470;margin-top:2px;line-height:1.4\">AI Agent chuyên trách + trợ lý điều phối<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">Giá trị cốt lõi mang lại cho doanh nghiệp: <strong>giảm chi phí vận hành<\u002Fstrong> nhờ AI tự xử lý, <strong>tăng tỷ lệ chuyển đổi<\u002Fstrong> nhờ phản hồi tức thời và cá nhân hoá, <strong>hợp nhất dữ liệu khách hàng<\u002Fstrong> (CDP 360°) làm nền tảng cho mọi quyết định, và <strong>khả năng mở rộng<\u002Fstrong> theo mô hình SaaS multi-tenant. Phiên bản 1.1 bổ sung góc nhìn kinh doanh và lộ trình để phục vụ cả cấp lãnh đạo và nhà đầu tư.<\u002Fp>\n\n<!-- 2 POSITIONING -->\n<h2 style=\"font-size:23px;font-weight:800;letter-spacing:-.01em;margin:36px 0 6px;padding-top:8px\">2. Định vị hệ thống<\u002Fh2>\n<div style=\"height:3px;width:46px;background:#2DC56A;border-radius:2px;margin-bottom:18px\"><\u002Fdiv>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 14px\">AppChat là <strong>Nền tảng AI Agents vận hành Doanh nghiệp Một Người<\u002Fstrong>. AppChat không phải phần mềm CRM, cũng không chỉ là nền tảng Omnichannel hay AI Chatbot — mà là nền tảng giúp doanh nghiệp vận hành toàn bộ hoạt động bằng đội ngũ AI Agents. Định vị này được hiểu đúng qua ba phủ định và năm khẳng định:<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n  <div style=\"border:1px solid #F2C9AE;background:#FDF6F1;border-radius:11px;padding:15px 17px\">\n    <div style=\"font-size:12px;font-weight:800;color:#A6481F;text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px\">Không phải là<\u002Fdiv>\n    <ul style=\"font-size:13.5px;line-height:1.65;color:#6B4A38;margin:0;padding-left:18px\">\n      <li>Phần mềm chat đơn thuần<\u002Fli>\n      <li>CRM truyền thống<\u002Fli>\n      <li>Helpdesk / ticketing thuần tuý<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n  <div style=\"border:1px solid #CDEBD9;background:#F6FBF8;border-radius:11px;padding:15px 17px\">\n    <div style=\"font-size:12px;font-weight:800;color:#157A40;text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px\">Chính là<\u002Fdiv>\n    <ul style=\"font-size:13.5px;line-height:1.65;color:#2E5A42;margin:0;padding-left:18px\">\n      <li>AI-Native Platform<\u002Fli>\n      <li>Agentic AI Platform<\u002Fli>\n      <li>Customer Experience Platform (CX)<\u002Fli>\n      <li>Customer Data Platform (CDP)<\u002Fli>\n      <li>Omnichannel &amp; Workflow Automation Platform<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">Sự khác biệt nằm ở chỗ AI không phải là tính năng bổ trợ mà là <em>hạ tầng vận hành<\u002Fem>: m g:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#EDFAF3;color:#157A40;border:1px solid #CDEBD9\">Ví · Thanh toán<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div style=\"text-align:center;color:#B7C0BB;font-size:14px;line-height:1;margin:1px 0 4px\">▼<\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-radius:11px;padding:11px 14px;margin-bottom:9px;background:#fff\"><div style=\"font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#6E48E6;margin-bottom:8px\">Lớp AI &amp; Agentic<\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:7px\"><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#F3EFFE;color:#6E48E6;border:1px solid #DDD3F7\">Orchestrator<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#F3EFFE;color:#6E48E6;border:1px solid #DDD3F7\">AI Agents<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#F3EFFE;color:#6E48E6;border:1px solid #DDD3F7\">Claude Coworks<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#F3EFFE;color:#6E48E6;border:1px solid #DDD3F7\">RAG · Knowledge Base<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#F3EFFE;color:#6E48E6;border:1px solid #DDD3F7\">NLP (intent/entity)<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#F3EFFE;color:#6E48E6;border:1px solid #DDD3F7\">AI Voice (STT/TTS)<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#F3EFFE;color:#6E48E6;border:1px solid #DDD3F7\">Sentiment · Memory<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div style=\"text-align:center;color:#B7C0BB;font-size:14px;line-height:1;margin:1px 0 4px\">▼<\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-radius:11px;padding:11px 14px;margin-bottom:9px;background:#fff\"><div style=\"font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#0E7C6B;margin-bottom:8px\">Dữ liệu &amp; Hạ tầng<\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:7px\"><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#E9F7F4;color:#0E7C6B;border:1px solid #C4E7E0\">PostgreSQL (multi-tenant, RLS)<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#E9F7F4;color:#0E7C6B;border:1px solid #C4E7E0\">Redis<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#E9F7F4;color:#0E7C6B;border:1px solid #C4E7E0\">Message Queue<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#E9F7F4;color:#0E7C6B;border:1px solid #C4E7E0\">Object Storage (S3)<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#E9F7F4;color:#0E7C6B;border:1px solid #C4E7E0\">Vector DB<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#E9F7F4;color:#0E7C6B;border:1px solid #C4E7E0\">Audit / Log<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div style=\"font-size:11.5px;color:#9CA3AF;margin-top:6px\">Giao tiếp bất đồng bộ qua hàng đợi sự kiện cho tác vụ nặng (broadcast, đồng bộ kênh, xử lý AI).<\u002Fdiv>\n<\u002Ffigure>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">Kiến trúc hướng dịch vụ, giao tiếp bất đồng bộ qua hàng đợi sự kiện cho tác vụ nặng (gửi broadcast, xử lý webhook, đồng bộ kênh) và đồng bộ qua API cho thao tác thời gian thực; realtime tới client dùng WebSocket. Mỗi dịch vụ sở hữu vùng dữ liệu riêng, trao đổi qua API/sự kiện thay vì chia sẻ bảng trực tiếp.<\u002Fp>\n\n<!-- 6 MULTI-TENANT -->\n<h2 style=\"font-size:23px;font-weight:800;letter-spacing:-.01em;margin:36px 0 6px;padding-top:8px\">6. Kiến trúc đa người thuê (Multi-tenant)<\u002Fh2>\n<div style=\"height:3px;width:46px;background:#2DC56A;border-radius:2px;margin-bottom:18px\"><\u002Fdiv>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 14px\">AppChat vận hành theo mô hình <strong>SaaS đa người thuê<\u002Fstrong>: một hệ thống duy nhất phục vụ nhiều doanh nghiệp, mỗi doanh nghiệp là một <strong>tenant<\u002Fstrong> (không gian làm việc — workspace) độc lập và không nhìn thấy dữ liệu của nhau. Toàn bộ dữ liệu, cấu hình, người dùng, ví và thương hiệu đều <strong>khoanh vùng theo từng tenant<\u002Fstrong>.<\u002Fp>\n\n<div style=\"font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#157A40;margin:8px 0 8px\">6.1 Tenant là gì &amp; phân cấp không gian làm việc<\u002Fdiv>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">Mỗi tenant tương ứng một doanh nghiệp đăng ký. Trong tenant, cơ cấu tổ chức phân cấp <strong>Tập đoàn → Công ty → Chi nhánh → Phòng ban → Nhóm<\u002Fstrong> (xem 4.3); quyền hạn và phạm vi dữ liệu thu hẹp dần theo cây tổ chức. Một tài khoản người dùng có thể được mời vào <strong>nhiều tenant<\u002Fstrong> và chuyển đổi tức thời qua menu Hồ sơ (Cá nhân · Team · Doanh nghiệp) mà không cần đăng nhập lại.<\u002Fp>\n\n<figure style=\"border:1px solid #E1E6E3;border-radius:12px;padding:20px;margin:10px 0 16px;background:#FCFDFC\" class=\"keep\">\n  <figcaption style=\"font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9CA3AF;margin-bottom:16px\">Sơ đồ 6.1 · Nền tảng → Tenant → Phân cấp workspace<\u002Ffigcaption>\n  <div style=\"border:1px dashed #C7CEC9;border-radius:11px;padding:12px 16px;margin-bottom:10px;background:#F4F7F5;text-align:center\"><div style=\"font-size:13.5px;font-weight:800;color:#5A6470\">AppChat Platform · SaaS đa người thuê<\u002Fdiv><div style=\"font-size:11.5px;color:#9CA3AF;margin-top:2px\">Hạ tầng · mô hình AI · bản cập nhật — dùng chung<\u002Fdiv><\u002Fdiv>\n  <div style=\"text-align:center;color:#B7C0BB;font-size:14px;line-height:1;margin:2px 0 8px\">▼<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px\">\n    <div style=\"border:1px solid #BFE6CE;border-radius:10px;padding:10px 12px;background:#F1FAF4;text-align:center\"><div style=\"font-size:13px;font-weight:800;color:#157A40\">Tenant A<\u002Fdiv><div style=\"font-size:11px;color:#5A6470\">Doanh nghiệp X<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #BFE6CE;border-radius:10px;padding:10px 12px;background:#F1FAF4;text-align:center\"><div style=\"font-size:13px;font-weight:800;color:#157A40\">Tenant B<\u002Fdiv><div style=\"font-size:11px;color:#5A6470\">Doanh nghiệp Y<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #BFE6CE;border-radius:10px;padding:10px 12px;background:#F1FAF4;text-align:center\"><div style=\"font-size:13px;font-weight:800;color:#157A40\">Tenant C<\u002Fdiv><div style=\"font-size:11px;color:#5A6470\">Doanh nghiệp Z<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border:1px solid #BFE6CE;border-radius:11px;padding:13px 15px 15px;background:#FBFEFC\">\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#157A40;margin-bottom:11px\">Bên trong 1 tenant · phân cấp workspace<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:0\">\n      <div style=\"border:1px solid #157A40;border-radius:9px;padding:7px 20px;background:#157A40;color:#fff;font-size:12.5px;font-weight:800\">Tập đoàn<\u002Fdiv>\n      <div style=\"width:1px;height:12px;background:#C7CEC9\"><\u002Fdiv>\n      <div style=\"border:1px solid #2DC56A;border-radius:9px;padding:7px 20px;background:#E9F9EF;color:#157A40;font-size:12.5px;font-weight:800\">Công ty<\u002Fdiv>\n      <div style=\"width:1px;height:12px;background:#C7CEC9\"><\u002Fdiv>\n      <div style=\"border:1px solid #93B7E8;border-radius:9px;padding:7px 20px;background:#EEF4FC;color:#2C5FA0;font-size:12.5px;font-weight:800\">Chi nhánh<\u002Fdiv>\n      <div style=\"width:1px;height:12px;background:#C7CEC9\"><\u002Fdiv>\n      <div style=\"border:1px solid #E3C77D;border-radius:9px;padding:7px 20px;background:#FCF6E7;color:#8A5A0C;font-size:12.5px;font-weight:800\">Phòng ban<\u002Fdiv>\n      <div style=\"width:1px;height:12px;background:#C7CEC9\"><\u002Fdiv>\n      <div style=\"border:1px solid #C7CEC9;border-radius:9px;padding:7px 20px;background:#F4F7F5;color:#5A6470;font-size:12.5px;font-weight:800\">Nhóm<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:11.5px;color:#9CA3AF;text-align:center;margin-top:10px\">Quyền hạn &amp; phạm vi dữ liệu thu hẹp dần theo cây tổ chức (xem 4.3)<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border:1px solid #DDD3F7;border-radius:10px;padding:10px 14px;margin-top:12px;background:#F6F3FE;display:flex;align-items:center;gap:10px\">\n    <div style=\"width:34px;height:34px;border-radius:50%;background:#6E48E6;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0\">U<\u002Fdiv>\n    <div style=\"font-size:12.5px;color:#5B4CA0;line-height:1.55\"><strong style=\"color:#6E48E6\">Một tài khoản → nhiều tenant.<\u002Fstrong> User có thể là <strong>quản trị<\u002Fstrong> ở Tenant A và <strong>nhân viên<\u002Fstrong> ở Tenant B; chuyển đổi tức thời qua menu Hồ sơ, không cần đăng nhập lại.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffigure>\n\n<div style=\"font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#157A40;margin:14px 0 8px\">6.2 Quy tắc nghiệp vụ cốt lõi<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:9px;margin:0 0 14px\">\n  <div style=\"border:1px solid #E1E6E3;border-left:4px solid #2DC56A;border-radius:10px;padding:11px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;color:#157A40;margin-bottom:2px\">Cô lập dữ liệu tuyệt đối<\u002Fdiv><div style=\"font-size:13px;color:#5A6470;line-height:1.6\">Mọi bản ghi (liên hệ, hội thoại, đơn, ticket, chiến dịch…) gắn <span class=\"mono\" style=\"font-size:12.5px\">tenant_id<\u002Fspan>. Tầng truy cập dữ liệu <strong>tự động cưỡng chế lọc theo tenant<\u002Fstrong> ở mọi truy vấn — không thao tác nào vượt ranh giới tenant.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-left:4px solid #2DC56A;border-radius:10px;padding:11px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;color:#157A40;margin-bottom:2px\">Cấu hình riêng theo tenant<\u002Fdiv><div style=\"font-size:13px;color:#5A6470;line-height:1.6\">Kênh kết nối, AI Agents, workflow, SLA, KPI, phân ca, trường dữ liệu, thẻ nhãn, câu trả lời mẫu… mỗi tenant tự thiết lập độc lập, không ảnh hưởng tenant khác.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-left:4px solid #2DC56A;border-radius:10px;padding:11px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;color:#157A40;margin-bottom:2px\">Phân quyền &amp; thành viên theo tenant<\u002Fdiv><div style=\"font-size:13px;color:#5A6470;line-height:1.6\">Vai trò (RBAC), phòng ban, sơ đồ tổ chức thuộc về từng tenant. Cùng một người có thể là quản trị ở tenant này và nhân viên ở tenant khác.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-left:4px solid #2DC56A;border-radius:10px;padding:11px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;color:#157A40;margin-bottom:2px\">Ví, gói &amp; hoá đơn tách bạch<\u002Fdiv><div style=\"font-size:13px;color:#5A6470;line-height:1.6\">Mỗi tenant có <strong>ví AppChat<\u002Fstrong>, gói dịch vụ, hạn mức token và hoá đơn riêng; chi tiêu token và tài nguyên (kênh, user tổng đài) tính theo tenant.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-left:4px solid #2DC56A;border-radius:10px;padding:11px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;color:#157A40;margin-bottom:2px\">Thương hiệu &amp; white-label<\u002Fdiv><div style=\"font-size:13px;color:#5A6470;line-height:1.6\">Logo, màu brand, tên miền, web widget và (tuỳ gói) white-label cấu hình riêng cho từng tenant.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<figure style=\"border:1px solid #E1E6E3;border-radius:12px;padding:20px;margin:10px 0 16px;background:#FCFDFC\" class=\"keep\">\n  <figcaption style=\"font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9CA3AF;margin-bottom:16px\">Sơ đồ 6.2 · Ranh giới cô lập giữa hai tenant<\u002Ffigcaption>\n  <div style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:stretch\">\n    <div style=\"border:2px solid #2DC56A;border-radius:12px;padding:14px;background:#F1FAF4\">\n      <div style=\"font-size:13px;font-weight:800;color:#157A40;text-align:center;margin-bottom:10px\">Tenant A<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <div style=\"background:#fff;border:1px solid #BFE6CE;border-radius:8px;padding:6px 10px;font-size:12px;color:#37424C\">🗄️ Dữ liệu nghiệp vụ · <span class=\"mono\" style=\"font-size:11px\">tenant_id=A<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #BFE6CE;border-radius:8px;padding:6px 10px;font-size:12px;color:#37424C\">⚙️ Cấu hình · kênh · AI Agents<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #BFE6CE;border-radius:8px;padding:6px 10px;font-size:12px;color:#37424C\">👥 Người dùng · RBAC · phòng ban<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #BFE6CE;border-radius:8px;padding:6px 10px;font-size:12px;color:#37424C\">💳 Ví · gói · token · hoá đơn<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #BFE6CE;border-radius:8px;padding:6px 10px;font-size:12px;color:#37424C\">🎨 Thương hiệu · white-label<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px\">\n      <div style=\"writing-mode:vertical-rl;font-size:11px;font-weight:800;letter-spacing:.1em;color:#C0392B;text-transform:uppercase;padding:8px 0\">⛔ Không vượt ranh giới<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:2px solid #93B7E8;border-radius:12px;padding:14px;background:#EEF4FC\">\n      <div style=\"font-size:13px;font-weight:800;color:#2C5FA0;text-align:center;margin-bottom:10px\">Tenant B<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <div style=\"background:#fff;border:1px solid #C6D9F1;border-radius:8px;padding:6px 10px;font-size:12px;color:#37424C\">🗄️ Dữ liệu nghiệp vụ · <span class=\"mono\" style=\"font-size:11px\">tenant_id=B<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #C6D9F1;border-radius:8px;padding:6px 10px;font-size:12px;color:#37424C\">⚙️ Cấu hình · kênh · AI Agents<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #C6D9F1;border-radius:8px;padding:6px 10px;font-size:12px;color:#37424C\">👥 Người dùng · RBAC · phòng ban<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #C6D9F1;border-radius:8px;padding:6px 10px;font-size:12px;color:#37424C\">💳 Ví · gói · token · hoá đơn<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #C6D9F1;border-radius:8px;padding:6px 10px;font-size:12px;color:#37424C\">🎨 Thương hiệu · white-label<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"text-align:center;color:#B7C0BB;font-size:14px;margin:10px 0 8px\">▼<\u002Fdiv>\n  <div style=\"border:1px dashed #C7CEC9;border-radius:11px;padding:11px 16px;background:#F4F7F5;text-align:center\"><div style=\"font-size:12.5px;font-weight:800;color:#5A6470\">Tầng truy cập dữ liệu · cưỡng chế lọc theo <span class=\"mono\" style=\"font-size:12px\">tenant_id<\u002Fspan> (Row-Level Security)<\u002Fdiv><div style=\"font-size:11.5px;color:#9CA3AF;margin-top:2px\">Mọi truy vấn tự động gắn điều kiện tenant — không thao tác nào đọc/ghi chéo tenant<\u002Fdiv><\u002Fdiv>\n<\u002Ffigure>\n\n<div style=\"font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#157A40;margin:14px 0 8px\">6.3 Phạm vi tách theo tenant<\u002Fdiv>\n<div style=\"border:1px solid #E1E6E3;border-radius:11px;overflow:hidden;margin:0 0 14px\" class=\"keep\">\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n    <sc-raw-thead><sc-raw-tr style=\"background:#F4F7F5\"><sc-raw-th style=\"text-align:left;padding:9px 15px;font-weight:800;color:#157A40;width:34%\">Hạng mục<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:9px 15px;font-weight:800;color:#157A40\">Tách theo tenant<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody style=\"color:#37424C\">\n      <sc-raw-tr style=\"border-top:1px solid #EEF1F0\"><sc-raw-td style=\"padding:8px 15px;font-weight:600\">Dữ liệu nghiệp vụ<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 15px;color:#5A6470\">Liên hệ, hội thoại, báo giá, hợp đồng, đơn hàng, ticket, lịch hẹn, chiến dịch<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #EEF1F0\"><sc-raw-td style=\"padding:8px 15px;font-weight:600\">Người dùng &amp; quyền<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 15px;color:#5A6470\">Thành viên, vai trò (RBAC), phòng ban, sơ đồ tổ chức<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #EEF1F0\"><sc-raw-td style=\"padding:8px 15px;font-weight:600\">Kênh &amp; AI<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 15px;color:#5A6470\">Kênh kết nối, AI Agents, RAG/Knowledge Base, workflow, SLA, KPI<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #EEF1F0\"><sc-raw-td style=\"padding:8px 15px;font-weight:600\">Tài chính<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 15px;color:#5A6470\">Ví, gói, hạn mức &amp; chi tiêu token, hoá đơn<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #EEF1F0\"><sc-raw-td style=\"padding:8px 15px;font-weight:600\">Thương hiệu<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 15px;color:#5A6470\">Logo, màu, tên miền, web widget, white-label<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-top:1px solid #EEF1F0\"><sc-raw-td style=\"padding:8px 15px;font-weight:600\">Dùng chung (platform)<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 15px;color:#9CA3AF\">Hạ tầng, mô hình AI nền tảng, bản cập nhật tính năng — vận hành tập trung<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n<\u002Fdiv>\n\n<figure style=\"border:1px solid #E1E6E3;border-radius:12px;padding:20px;margin:10px 0 16px;background:#FCFDFC\" class=\"keep\">\n  <figcaption style=\"font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9CA3AF;margin-bottom:16px\">Sơ đồ 6.3 · Lớp riêng theo tenant vs. lớp dùng chung<\u002Ffigcaption>\n  <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px\">\n    <div style=\"border:1px solid #BFE6CE;border-radius:10px;padding:11px 8px;background:#F1FAF4;text-align:center\"><div style=\"font-size:19px;margin-bottom:3px\">🗄️<\u002Fdiv><div style=\"font-size:11.5px;font-weight:800;color:#157A40;line-height:1.3\">Dữ liệu nghiệp vụ<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #BFE6CE;border-radius:10px;padding:11px 8px;background:#F1FAF4;text-align:center\"><div style=\"font-size:19px;margin-bottom:3px\">👥<\u002Fdiv><div style=\"font-size:11.5px;font-weight:800;color:#157A40;line-height:1.3\">Người dùng &amp; quyền<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #BFE6CE;border-radius:10px;padding:11px 8px;background:#F1FAF4;text-align:center\"><div style=\"font-size:19px;margin-bottom:3px\">🤖<\u002Fdiv><div style=\"font-size:11.5px;font-weight:800;color:#157A40;line-height:1.3\">Kênh &amp; AI<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #BFE6CE;border-radius:10px;padding:11px 8px;background:#F1FAF4;text-align:center\"><div style=\"font-size:19px;margin-bottom:3px\">💳<\u002Fdiv><div style=\"font-size:11.5px;font-weight:800;color:#157A40;line-height:1.3\">Tài chính<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #BFE6CE;border-radius:10px;padding:11px 8px;background:#F1FAF4;text-align:center\"><div style=\"font-size:19px;margin-bottom:3px\">🎨<\u002Fdiv><div style=\"font-size:11.5px;font-weight:800;color:#157A40;line-height:1.3\">Thương hiệu<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"text-align:center;font-size:11.5px;font-weight:800;color:#2DC56A;letter-spacing:.03em;text-transform:uppercase;margin-bottom:12px\">▲ Riêng theo từng tenant (cô lập)<\u002Fdiv>\n  <div style=\"border:1px dashed #C7CEC9;border-radius:11px;padding:13px 16px;background:#F4F7F5\">\n    <div style=\"text-align:center;font-size:11.5px;font-weight:800;color:#9CA3AF;letter-spacing:.03em;text-transform:uppercase;margin-bottom:9px\">▼ Dùng chung · vận hành tập trung (platform)<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:8px\">\n      <div style=\"background:#fff;border:1px solid #E1E6E3;border-radius:8px;padding:8px 10px;text-align:center;font-size:12px;font-weight:700;color:#5A6470\">Hạ tầng &amp; lưu trữ<\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E1E6E3;border-radius:8px;padding:8px 10px;text-align:center;font-size:12px;font-weight:700;color:#5A6470\">Mô hình AI nền tảng<\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E1E6E3;border-radius:8px;padding:8px 10px;text-align:center;font-size:12px;font-weight:700;color:#5A6470\">Bản cập nhật tính năng<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffigure>\n\n<div style=\"background:#FFF8EC;border:1px solid #F2D9A8;border-radius:10px;padding:14px 16px;margin:14px 0 12px\" class=\"keep\">\n  <div style=\"font-size:13px;font-weight:700;color:#8A5A0C;margin-bottom:5px\">6.4 Chiến lược cô lập dữ liệu (kỹ thuật)<\u002Fdiv>\n  <p style=\"font-size:13.5px;line-height:1.6;color:#6B5418;margin:0\">Mặc định <strong>shared database, shared schema<\u002Fstrong> với <span class=\"mono\" style=\"font-size:12.5px\">tenant_id<\u002Fspan> + row-level security bảo đảm cô lập ở tầng dữ liệu; tenant lớn hoặc yêu cầu tuân thủ cao có thể nâng lên <strong>schema riêng<\u002Fstrong> hoặc <strong>database riêng<\u002Fstrong> mà không thay đổi mô hình logic ứng dụng.<\u002Fp>\n<\u002Fdiv>\n\n<!-- 7 AI -->\n<h2 class=\"pgbreak\" style=\"font-size:23px;font-weight:800;letter-spacing:-.01em;margin:36px 0 6px;padding-top:8px\">7. Lớp AI &amp; Agentic<\u002Fh2>\n<div style=\"height:3px;width:46px;background:#2DC56A;border-radius:2px;margin-bottom:18px\"><\u002Fdiv>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 14px\">Trợ lý AI là bộ điều phối (orchestrator): hiểu mệnh lệnh hội thoại, định tuyến theo intent tới agent chuyên trách, gọi công cụ (function calling) và tổng hợp kết quả. Bốn agent — Marketing, Sales, CSKH, Operation — chia sẻ năng lực nền tảng và thực thi hành động trên dịch vụ lõi.<\u002Fp>\n<figure style=\"border:1px solid #E1E6E3;border-radius:12px;padding:20px 20px 16px;margin:10px 0 16px;background:#FCFDFC\" class=\"keep\">\n  <figcaption style=\"font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9CA3AF;margin-bottom:14px\">Trợ lý AI điều phối · 4 Agent chuyên trách<\u002Ffigcaption>\n  <div style=\"border:1px solid #DDD3F7;border-radius:11px;padding:13px 16px;margin-bottom:9px;background:#F3EFFE;text-align:center\"><div style=\"font-size:14px;font-weight:800;color:#6E48E6\">Trợ lý AI — Orchestrator<\u002Fdiv><div style=\"font-size:12px;color:#6B5CA8;margin-top:2px\">Hiểu mệnh lệnh hội thoại · định tuyến theo intent · gọi công cụ (function calling) · tổng hợp kết quả<\u002Fdiv><\u002Fdiv>\n  <div style=\"text-align:center;color:#B7C0BB;font-size:14px;line-height:1;margin:1px 0 4px\">▼<\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-bottom:9px\">\n    <div style=\"flex:1;min-width:120px;border:1px solid #F6D3BF;border-top:3px solid #E8602C;border-radius:10px;padding:11px 13px;background:#FFF3EC\"><div style=\"font-size:13px;font-weight:800;color:#E8602C;margin-bottom:3px\">Marketing<\u002Fdiv><div style=\"font-size:11.5px;color:#5A6470;line-height:1.5\">Chiến dịch, broadcast, nội dung<\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;min-width:120px;border:1px solid #CDEBD9;border-top:3px solid #157A40;border-radius:10px;padding:11px 13px;background:#EDFAF3\"><div style=\"font-size:13px;font-weight:800;color:#157A40;margin-bottom:3px\">Sales<\u002Fdiv><div style=\"font-size:11.5px;color:#5A6470;line-height:1.5\">Báo giá, đơn, chốt cơ hội<\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;min-width:120px;border:1px solid #BBD9F5;border-top:3px solid #2A6FDB;border-radius:10px;padding:11px 13px;background:#EFF7FF\"><div style=\"font-size:13px;font-weight:800;color:#2A6FDB;margin-bottom:3px\">CSKH<\u002Fdiv><div style=\"font-size:11.5px;color:#5A6470;line-height:1.5\">Ticket, phản hồi, CSAT<\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;min-width:120px;border:1px solid #DDD3F7;border-top:3px solid #6E48E6;border-radius:10px;padding:11px 13px;background:#F3EFFE\"><div style=\"font-size:13px;font-weight:800;color:#6E48E6;margin-bottom:3px\">Operation<\u002Fdiv><div style=\"font-size:11.5px;color:#5A6470;line-height:1.5\">Workflow, điều phối vận hành<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"text-align:center;color:#B7C0BB;font-size:14px;line-height:1;margin:1px 0 4px\">▼<\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-radius:11px;padding:11px 14px;margin-bottom:9px;background:#fff\"><div style=\"font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#0E7C6B;margin-bottom:8px\">Năng lực nền tảng dùng chung<\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:7px\"><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#E9F7F4;color:#0E7C6B;border:1px solid #C4E7E0\">NLP<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#E9F7F4;color:#0E7C6B;border:1px solid #C4E7E0\">Knowledge Base + RAG<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#E9F7F4;color:#0E7C6B;border:1px solid #C4E7E0\">Tools / Function calling<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#E9F7F4;color:#0E7C6B;border:1px solid #C4E7E0\">AI Voice<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#E9F7F4;color:#0E7C6B;border:1px solid #C4E7E0\">Sentiment<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#E9F7F4;color:#0E7C6B;border:1px solid #C4E7E0\">Bộ nhớ hội thoại<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div style=\"text-align:center;color:#B7C0BB;font-size:14px;line-height:1;margin:1px 0 4px\">▼<\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-radius:11px;padding:11px 14px;margin-bottom:9px;background:#fff\"><div style=\"font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#157A40;margin-bottom:8px\">Thực thi trên Dịch vụ lõi<\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:7px\"><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#EDFAF3;color:#157A40;border:1px solid #CDEBD9\">Hộp thư<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#EDFAF3;color:#157A40;border:1px solid #CDEBD9\">CRM<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#EDFAF3;color:#157A40;border:1px solid #CDEBD9\">Bán hàng<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#EDFAF3;color:#157A40;border:1px solid #CDEBD9\">Ticket<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#EDFAF3;color:#157A40;border:1px solid #CDEBD9\">Lịch hẹn<\u002Fspan><span style=\"display:inline-block;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;background:#EDFAF3;color:#157A40;border:1px solid #CDEBD9\">Workflow<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #F2D9A8;background:#FFF8EC;border-radius:9px;padding:10px 13px;margin-top:8px;font-size:12px;color:#6B5418;line-height:1.55\"><strong style=\"color:#8A5A0C\">Human-in-the-loop:<\u002Fstrong> AI tự xử lý khi đủ độ tin cậy; khi vượt ngưỡng / khách yêu cầu gặp người / phát hiện khiếu nại → chuyển giao nhân viên kèm tóm tắt. Mọi hành động AI được ghi nhật ký &amp; hoàn tác được.<\u002Fdiv>\n<\u002Ffigure>\n<h3 style=\"font-size:16px;font-weight:700;margin:18px 0 8px\">7.1 Năng lực dùng chung<\u002Fh3>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">NLP (intent/entity), Knowledge Base + RAG, Tools/function calling, AI Voice (STT/TTS), phân loại sentiment và bộ nhớ hội thoại — dùng chung cho mọi agent để nhất quán và tối ưu chi phí token.<\u002Fp>\n\n<figure style=\"border:1px solid #E1E6E3;border-radius:12px;padding:20px;margin:10px 0 18px;background:#FCFDFC\" class=\"keep\">\n  <figcaption style=\"font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9CA3AF;margin-bottom:16px\">Sơ đồ 7.1 · Pipeline năng lực dùng chung — một request đi qua các lớp<\u002Ffigcaption>\n  <div style=\"display:flex;align-items:stretch;gap:8px;flex-wrap:nowrap\">\n    <div style=\"flex:0 0 96px;border:1px solid #DDD3F7;border-radius:10px;padding:10px 8px;background:#F3EFFE;display:flex;flex-direction:column;justify-content:center;text-align:center\"><div style=\"font-size:18px\">💬<\u002Fdiv><div style=\"font-size:11.5px;font-weight:800;color:#6E48E6;line-height:1.3;margin-top:3px\">Mệnh lệnh hội thoại<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;color:#B7C0BB;font-size:16px;font-weight:700\">→<\u002Fdiv>\n    <div style=\"flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:7px\">\n      <div style=\"border:1px solid #C4E7E0;border-top:3px solid #0E7C6B;border-radius:9px;padding:9px 10px;background:#EAF8F5\"><div style=\"font-size:12.5px;font-weight:800;color:#0E7C6B\">① NLP<\u002Fdiv><div style=\"font-size:11px;color:#5A6470;line-height:1.45;margin-top:2px\">Nhận diện intent &amp; entity, chuẩn hoá ngữ cảnh<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #C4E7E0;border-top:3px solid #0E7C6B;border-radius:9px;padding:9px 10px;background:#EAF8F5\"><div style=\"font-size:12.5px;font-weight:800;color:#0E7C6B\">② KB + RAG<\u002Fdiv><div style=\"font-size:11px;color:#5A6470;line-height:1.45;margin-top:2px\">Truy hồi tri thức tenant, trích dẫn nguồn<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #C4E7E0;border-top:3px solid #0E7C6B;border-radius:9px;padding:9px 10px;background:#EAF8F5\"><div style=\"font-size:12.5px;font-weight:800;color:#0E7C6B\">③ Tools<\u002Fdiv><div style=\"font-size:11px;color:#5A6470;line-height:1.45;margin-top:2px\">Function calling tới dịch vụ lõi<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #C4E7E0;border-top:3px solid #0E7C6B;border-radius:9px;padding:9px 10px;background:#EAF8F5\"><div style=\"font-size:12.5px;font-weight:800;color:#0E7C6B\">④ Sentiment<\u002Fdiv><div style=\"font-size:11px;color:#5A6470;line-height:1.45;margin-top:2px\">Đo cảm xúc, cảnh báo rủi ro / khiếu nại<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #C4E7E0;border-top:3px solid #0E7C6B;border-radius:9px;padding:9px 10px;background:#EAF8F5\"><div style=\"font-size:12.5px;font-weight:800;color:#0E7C6B\">⑤ AI Voice<\u002Fdiv><div style=\"font-size:11px;color:#5A6470;line-height:1.45;margin-top:2px\">STT / TTS cho kênh thoại<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #C4E7E0;border-top:3px solid #0E7C6B;border-radius:9px;padding:9px 10px;background:#EAF8F5\"><div style=\"font-size:12.5px;font-weight:800;color:#0E7C6B\">⑥ Bộ nhớ<\u002Fdiv><div style=\"font-size:11px;color:#5A6470;line-height:1.45;margin-top:2px\">Ghi nhớ hội thoại &amp; ngữ cảnh dài<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;color:#B7C0BB;font-size:16px;font-weight:700\">→<\u002Fdiv>\n    <div style=\"flex:0 0 96px;border:1px solid #CDEBD9;border-radius:10px;padding:10px 8px;background:#EDFAF3;display:flex;flex-direction:column;justify-content:center;text-align:center\"><div style=\"font-size:18px\">🤖<\u002Fdiv><div style=\"font-size:11.5px;font-weight:800;color:#157A40;line-height:1.3;margin-top:3px\">4 Agent thực thi<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:center;gap:8px;margin-top:12px;border-top:1px dashed #E1E6E3;padding-top:11px\">\n    <span style=\"font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#8A5A0C;background:#FFF8EC;border:1px solid #F2D9A8;border-radius:6px;padding:4px 9px\">Dùng chung<\u002Fspan>\n    <span style=\"font-size:12px;color:#5A6470;line-height:1.5\">Cả 6 lớp là <strong>một hạ tầng năng lực<\u002Fstrong> — mọi agent gọi chung để nhất quán chất lượng và <strong>tối ưu chi phí token<\u002Fstrong>; cấu hình KB/Tools tách riêng theo tenant.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffigure>\n<h3 style=\"font-size:16px;font-weight:700;margin:18px 0 8px\">7.2 Human-in-the-loop &amp; AI Governance<\u002Fh3>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">Agent tự xử lý khi đủ độ tin cậy; khi vượt ngưỡng, khách yêu cầu gặp người, hoặc phát hiện khiếu nại/rủi ro, hệ thống chuyển giao cho nhân viên. Mọi hành động AI được ghi nhật ký, có thể hoàn tác và truy vết phục vụ AI Governance.<\u002Fp>\n\n<figure style=\"border:1px solid #E1E6E3;border-radius:12px;padding:20px;margin:10px 0 16px;background:#FCFDFC\" class=\"keep\">\n  <figcaption style=\"font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9CA3AF;margin-bottom:16px\">Sơ đồ 7.2 · Flow Human-in-the-loop &amp; AI Governance<\u002Ffigcaption>\n  <div style=\"display:flex;flex-direction:column;align-items:center;gap:0\">\n    <div style=\"border:1px solid #DDD3F7;border-radius:9px;padding:8px 18px;background:#F3EFFE;color:#6E48E6;font-size:12.5px;font-weight:800\">AI nhận nhiệm vụ<\u002Fdiv>\n    <div style=\"width:1px;height:12px;background:#C7CEC9\"><\u002Fdiv>\n    <div style=\"border:1px solid #E3C77D;border-radius:9px;padding:9px 20px;background:#FCF6E7;color:#8A5A0C;font-size:12.5px;font-weight:800;text-align:center\">◆ Kiểm tra: độ tin cậy · mức rủi ro · giá trị hành động<div style=\"font-size:11px;font-weight:600;color:#6B5418;margin-top:2px\">Khách yêu cầu gặp người? Phát hiện khiếu nại?<\u002Fdiv><\u002Fdiv>\n    <div style=\"width:1px;height:10px;background:#C7CEC9\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:2px\">\n    <div style=\"border:1.5px solid #BFE6CE;border-radius:11px;padding:12px 14px;background:#F1FAF4\">\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#157A40;margin-bottom:8px\">✓ Đủ tin cậy · rủi ro thấp<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:0\">\n        <div style=\"background:#fff;border:1px solid #BFE6CE;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;color:#157A40;text-align:center;width:100%\">AI tự thực thi<\u002Fdiv>\n        <div style=\"width:1px;height:9px;background:#C7CEC9\"><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #BFE6CE;border-radius:8px;padding:7px 12px;font-size:12px;color:#37424C;text-align:center;width:100%\">Ghi nhật ký hành động<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1.5px solid #F2C7B0;border-radius:11px;padding:12px 14px;background:#FFF3EC\">\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#C0392B;margin-bottom:8px\">⚠ Vượt ngưỡng · rủi ro cao<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:0\">\n        <div style=\"background:#fff;border:1px solid #F2C7B0;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;color:#C0392B;text-align:center;width:100%\">Chuyển giao nhân viên<div style=\"font-size:10.5px;font-weight:500;color:#8A5A0C\">kèm tóm tắt &amp; đề xuất<\u002Fdiv><\u002Fdiv>\n        <div style=\"width:1px;height:9px;background:#C7CEC9\"><\u002Fdiv>\n        <div style=\"display:flex;gap:5px;width:100%\"><span style=\"flex:1;background:#fff;border:1px solid #CDEBD9;border-radius:7px;padding:5px 4px;font-size:10.5px;font-weight:700;color:#157A40;text-align:center\">Duyệt<\u002Fspan><span style=\"flex:1;background:#fff;border:1px solid #C6D9F1;border-radius:7px;padding:5px 4px;font-size:10.5px;font-weight:700;color:#2C5FA0;text-align:center\">Sửa<\u002Fspan><span style=\"flex:1;background:#fff;border:1px solid #F2C7B0;border-radius:7px;padding:5px 4px;font-size:10.5px;font-weight:700;color:#C0392B;text-align:center\">Từ chối<\u002Fspan><\u002Fdiv>\n        <div style=\"width:1px;height:9px;background:#C7CEC9\"><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #F2C7B0;border-radius:8px;padding:7px 12px;font-size:12px;color:#37424C;text-align:center;width:100%\">Thực thi &amp; ghi nhật ký<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border:1px dashed #C7CEC9;border-radius:11px;padding:12px 15px;margin-top:13px;background:#F4F7F5\">\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#5A6470;margin-bottom:9px\">AI Governance · áp dụng xuyên suốt<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\">\n      <div style=\"background:#fff;border:1px solid #E1E6E3;border-radius:8px;padding:8px 9px;text-align:center;font-size:11.5px;font-weight:700;color:#5A6470\">📜 Nhật ký &amp; truy vết<\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E1E6E3;border-radius:8px;padding:8px 9px;text-align:center;font-size:11.5px;font-weight:700;color:#5A6470\">↩️ Hoàn tác (undo)<\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E1E6E3;border-radius:8px;padding:8px 9px;text-align:center;font-size:11.5px;font-weight:700;color:#5A6470\">🛡️ Guardrail &amp; ngưỡng<\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E1E6E3;border-radius:8px;padding:8px 9px;text-align:center;font-size:11.5px;font-weight:700;color:#5A6470\">🔒 Phân quyền theo tenant<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffigure>\n\n<!-- 8 FUNCTIONAL -->\n<h2 class=\"pgbreak\" style=\"font-size:23px;font-weight:800;letter-spacing:-.01em;margin:36px 0 6px;padding-top:8px\">8. Thiết kế chức năng theo module<\u002Fh2>\n<div style=\"height:3px;width:46px;background:#2DC56A;border-radius:2px;margin-bottom:18px\"><\u002Fdiv>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 14px\">17 module nghiệp vụ, tổ chức theo cụm chức năng trên thanh điều hướng. Bản đồ menu điều hướng đầy đủ (mục 8.13) thể hiện chi tiết cấu trúc điều hướng.<\u002Fp>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">11 mục điều hướng chính, mô tả theo <strong>đúng thứ tự trên thanh sidebar<\u002Fstrong>. Mỗi mục dưới đây tương ứng 1:1 với bản đồ menu ở 8.13.<\u002Fp><h3 style=\"font-size:16px;font-weight:700;margin:20px 0 7px\">8.1 Tổng quan (Dashboard)<\u002Fh3><p style=\"font-size:14px;line-height:1.7;color:#37424C;margin:0 0 8px\">Màn hình khởi đầu — <strong>trung tâm điều hành<\u002Fstrong> tổng hợp sức khoẻ vận hành theo thời gian thực và mở lối đi nhanh vào mọi nghiệp vụ. Kết hợp bảng KPI, ô ra lệnh AI, các thẻ giao việc theo phòng ban và bảng xếp hạng hiệu suất đội ngũ trên một màn hình duy nhất.<\u002Fp><ul style=\"margin:2px 0 14px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 26px\"><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Dải <strong>KPI thời gian thực<\u002Fstrong>: hội thoại, lead mới, ticket, doanh số, CSAT…<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Ô <strong>ra lệnh AI<\u002Fstrong> ngay đầu trang (gõ / mở lệnh nhanh, @ tham chiếu)<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>4 thẻ giao việc<\u002Fstrong> theo phòng ban: Marketing · Kinh doanh · CSKH · Vận hành<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Carousel<\u002Fstrong> giới thiệu năng lực AI tự trượt (thẻ thứ 5)<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Khối <strong>“Gợi ý cho bạn”<\u002Fstrong> — các câu lệnh gợi ý theo ngữ cảnh<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Onboarding từng bước<\u002Fstrong> — checklist thiết lập ban đầu, thu gọn được<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Bảng <strong>hiệu suất đội ngũ<\u002Fstrong>: hội thoại · FRT · CSAT · deal · ticket · % mục tiêu<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Lọc &amp; phân trang bảng KPI theo nhóm / loại nhân sự (người · AI)<\u002Fli><\u002Ful><div class=\"keep\" style=\"border:1px solid #DCEBF7;background:#F3F9FF;border-radius:9px;padding:9px 13px;margin:0 0 14px;font-size:12.5px;color:#2A5580;line-height:1.55\"><strong style=\"color:#2A6FDB\">Widget góc phải · <\u002Fstrong>Panel nổi “Trung tâm cập nhật” 3 tab — <strong>Cần follow hôm nay<\u002Fstrong> (khách đến hạn / quá hạn, nút ✓ hoàn tất, tối đa 5 + “Mở tất cả”), <strong>Tin tức<\u002Fstrong> (bản tin sản phẩm), <strong>Thông báo<\u002Fstrong> (badge đỏ số chưa đọc). Thu về nút bong bóng “Cập nhật” khi đóng.<\u002Fdiv><h3 style=\"font-size:16px;font-weight:700;margin:20px 0 7px\">8.2 Trợ lý AI<\u002Fh3><p style=\"font-size:14px;line-height:1.7;color:#37424C;margin:0 0 8px\">Bộ điều phối trung tâm — <strong>ra lệnh bằng hội thoại<\u002Fstrong> để tạo báo cáo, quy trình, chiến dịch, AI Agent, tra cứu &amp; thao tác dữ liệu. Màn chào có ô soạn lệnh lớn, 4 thẻ nghiệp vụ và các gợi ý theo ngữ cảnh; khi trò chuyện, AI trả lời kèm <strong>thẻ hành động<\u002Fstrong> để mở thẳng kết quả (báo cáo, workflow…).<\u002Fp><ul style=\"margin:2px 0 14px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 26px\"><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Ô soạn lệnh<\u002Fstrong> đa dòng: gõ / mở lệnh nhanh, @ tham chiếu khách/chiến dịch, nhập giọng nói<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>4 thẻ nghiệp vụ<\u002Fstrong>: Gợi ý AI · Marketing · Kinh doanh · CSKH · Vận hành<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Câu <strong>gợi ý theo nghiệp vụ<\u002Fstrong> đổi theo thẻ đang chọn<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Trả lời kèm <strong>thẻ hành động<\u002Fstrong> deep-link tới kết quả<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Phiên trò chuyện<\u002Fstrong>: lưu &amp; tìm lại theo nhóm nghiệp vụ · thời gian<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Nhật ký hành động<\u002Fstrong>: lọc theo loại (tạo/cập nhật/gửi/xuất) + <strong>hoàn tác<\u002Fstrong><\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Nút “Cuộc trò chuyện mới” &amp; điều hướng 3 tab (Trò chuyện · Phiên · Nhật ký)<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Nhúng dạng <strong>bản thu nhỏ (co-pilot)<\u002Fstrong> trong mọi module nghiệp vụ<\u002Fli><\u002Ful><div class=\"keep\" style=\"border:1px solid #F2D9A8;background:#FFF8EC;border-radius:9px;padding:9px 13px;margin:0 0 14px;font-size:12.5px;color:#6B5418;line-height:1.55\"><strong style=\"color:#8A5A0C\">Quy tắc nghiệp vụ · <\u002Fstrong>Mọi hành động do AI thực thi đều được ghi vào Nhật ký và có thể hoàn tác; hành động rủi ro cao cần người xác nhận trước khi chạy (xem Chương 7 · Human-in-the-loop &amp; AI Governance).<\u002Fdiv><h3 style=\"font-size:16px;font-weight:700;margin:20px 0 7px\">8.3 Hộp thư omnichannel<\u002Fh3><p style=\"font-size:14px;line-height:1.7;color:#37424C;margin:0 0 8px\">Một inbox hợp nhất mọi kênh (Zalo, Facebook, WhatsApp, TikTok, Web, Email…). Bố cục 3 cột: danh sách hội thoại (lọc theo kênh/trạng thái/phụ trách) — cửa sổ chat — <strong>hồ sơ 360°<\u002Fstrong> của khách. AI trực song song, gợi ý phản hồi và chỉ chuyển giao khi cần.<\u002Fp><ul style=\"margin:2px 0 14px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 26px\"><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Hợp nhất đa kênh<\u002Fstrong> theo thời gian thực, huy hiệu kênh trên từng hội thoại<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Gán &amp; chuyển<\u002Fstrong> hội thoại cho người / phòng ban / AI Agent<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Nhãn · ưu tiên · SLA<\u002Fstrong> đếm ngược, cảnh báo sắp/quá hạn<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Trả lời nhanh (macro)<\u002Fstrong>, chèn biến động, đính kèm sản phẩm<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Ghi chú nội bộ<\u002Fstrong> &amp; @mention đồng đội, không lộ với khách<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Dịch 2 chiều<\u002Fstrong> tự động theo ngôn ngữ khách<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>AI gợi ý phản hồi<\u002Fstrong> + tóm tắt hội thoại khi tiếp nhận<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Tạo nhanh <strong>ticket / báo giá / lịch hẹn<\u002Fstrong> ngay trong cửa sổ chat<\u002Fli><\u002Ful><div class=\"keep\" style=\"border:1px solid #F2D9A8;background:#FFF8EC;border-radius:9px;padding:9px 13px;margin:0 0 14px;font-size:12.5px;color:#6B5418;line-height:1.55\"><strong style=\"color:#8A5A0C\">Quy tắc nghiệp vụ · <\u002Fstrong>Mỗi hội thoại luôn gắn với một hồ sơ khách 360° (lịch sử mua, ticket, điểm loyalty, giao dịch); thao tác nghiệp vụ tạo từ inbox tự liên kết ngược về khách và ghi vào dòng thời gian.<\u002Fdiv><h3 style=\"font-size:16px;font-weight:700;margin:18px 0 8px\">8.4 Khách hàng &amp; CRM<\u002Fh3><p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 6px\">Cụm <strong>flyout Khách hàng &amp; CRM trên thanh menu gồm 6 mục<\u002Fstrong> (Liên hệ, Báo giá, Hợp đồng, Đơn hàng, Sản phẩm &amp; Dịch vụ, Loyalty). Tất cả dùng chung phong cách bảng (danh sách / kanban / bộ lọc / xuất Excel), cột <strong>AI gợi ý<\u002Fstrong> hiển thị trực tiếp trên hàng và bulk actions. Mỗi mục dưới đây kèm <strong>sơ đồ luồng nghiệp vụ<\u002Fstrong>.<\u002Fp><h4 style=\"font-size:15px;font-weight:800;color:#231F20;margin:18px 0 6px;padding-top:4px;display:flex;align-items:center;gap:9px\"><span style=\"display:inline-block;width:24px;height:24px;border-radius:7px;background:#2DC56A;color:#fff;font-size:11px;font-weight:800;text-align:center;line-height:24px\">4.1<\u002Fspan>Liên hệ (CDP)<\u002Fh4><p style=\"font-size:14px;line-height:1.7;color:#37424C;margin:0 0 4px\">Nền tảng dữ liệu khách hàng hợp nhất: mọi liên hệ từ form, import Excel, hội thoại đa kênh và API đổ về một hồ sơ duy nhất. Trước khi ghi nhận, hệ thống <strong>check trùng theo MST / SĐT / email<\u002Fstrong> để tạo mới hoặc gộp. Hồ sơ được làm giàu bằng trường tuỳ biến (custom field), điểm &amp; hạng, phân khúc động; mở ra <strong>hồ sơ 360°<\u002Fstrong> để xem toàn bộ lịch sử tương tác và tạo nhanh báo giá / ticket / lịch hẹn.<\u002Fp><figure class=\"keep\"
