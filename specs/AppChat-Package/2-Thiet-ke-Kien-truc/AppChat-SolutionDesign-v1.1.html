ght:700;line-height:1.2;background:#FFF8EC;color:#8A5A0C;border:1px solid #F2D9A8\">Xét hạng<\u002Fspan><span style=\"color:#B7C0BB;font-weight:800;font-size:13px\">→<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;line-height:1.2;background:#fff;color:#37424C;border:1px solid #E1E6E3\">Đổi điểm / ưu đãi<\u002Fspan><span style=\"color:#B7C0BB;font-weight:800;font-size:13px\">→<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;line-height:1.2;background:#F2FBF5;color:#157A40;border:1px solid #CDE9D6;font-weight:800\">Nhật ký điểm<\u002Fspan><\u002Fdiv><figcaption style=\"font-size:11.5px;color:#8A93A0;margin-top:11px;letter-spacing:.02em\">Luồng 8.4.6 · Cấu hình → tích điểm theo giao dịch → xét hạng → đổi thưởng<\u002Ffigcaption><\u002Ffigure><h3 class=\"pgbreak\" style=\"font-size:16px;font-weight:700;margin:22px 0 7px;padding-top:8px\">8.5 Hỗ trợ (Tickets)<\u002Fh3><p style=\"font-size:14px;line-height:1.7;color:#37424C;margin:0 0 8px\"><strong>Menu lớn độc lập<\u002Fstrong> trên thanh điều hướng (không trực thuộc Khách hàng &amp; CRM). Trung tâm CSKH tiếp nhận yêu cầu từ mọi nguồn (chat, email, gọi, form), <strong>AI phân loại &amp; định tuyến<\u002Fstrong>, gán <strong>SLA đếm ngược<\u002Fstrong>; nhân viên xử lý bằng macro &amp; ghi chú nội bộ, vượt hạn thì tự chuyển cấp; đóng ticket kèm khảo sát CSAT.<\u002Fp><ul style=\"margin:2px 0 14px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 26px\"><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#E8602C\"><\u002Fspan><strong>Tiếp nhận đa nguồn<\u002Fstrong>: chat · email · gọi · form gộp về một hàng đợi<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#E8602C\"><\u002Fspan><strong>AI phân loại &amp; định tuyến<\u002Fstrong> theo chủ đề, độ ưu tiên, phòng ban<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#E8602C\"><\u002Fspan><strong>SLA đếm ngược<\u002Fstrong> — cảnh báo sắp/vượt hạn, tự động escalate<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#E8602C\"><\u002Fspan><strong>Macro<\u002Fstrong> trả lời nhanh + <strong>ghi chú nội bộ<\u002Fstrong>, @mention đồng đội<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#E8602C\"><\u002Fspan>Hiển thị <strong>danh sách &amp; kanban<\u002Fstrong> theo trạng thái · bộ lọc · xuất Excel<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#E8602C\"><\u002Fspan>Cột <strong>AI gợi ý<\u002Fstrong> trực tiếp trên hàng + <strong>bulk actions<\u002Fstrong><\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#E8602C\"><\u002Fspan>Gắn <strong>hồ sơ khách 360°<\u002Fstrong>, liên kết hội thoại · đơn · lịch hẹn<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#E8602C\"><\u002Fspan>Đóng ticket kèm <strong>khảo sát CSAT<\u002Fstrong>, thống kê hiệu suất &amp; SLA<\u002Fli><\u002Ful><figure class=\"keep\" style=\"border:1px solid #E1E6E3;border-radius:12px;padding:14px 16px;margin:9px 0 16px;background:#FBFCFB\"><div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;line-height:1.2;background:#157A40;color:#fff;border:1px solid #157A40\">Tiếp nhận: Chat · Email · Gọi · Form<\u002Fspan><span style=\"color:#B7C0BB;font-weight:800;font-size:13px\">→<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;line-height:1.2;background:#F3EEFE;color:#6E48E6;border:1px solid #DCD0F7\">AI phân loại &amp; định tuyến<\u002Fspan><span style=\"color:#B7C0BB;font-weight:800;font-size:13px\">→<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;line-height:1.2;background:#fff;color:#37424C;border:1px solid #E1E6E3\">Gán SLA đếm ngược<\u002Fspan><span style=\"color:#B7C0BB;font-weight:800;font-size:13px\">→<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;line-height:1.2;background:#fff;color:#37424C;border:1px solid #E1E6E3\">Xử lý (macro / nội bộ)<\u002Fspan><span style=\"color:#B7C0BB;font-weight:800;font-size:13px\">→<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;line-height:1.2;background:#FFF8EC;color:#8A5A0C;border:1px solid #F2D9A8\">Vượt SLA?<\u002Fspan><span style=\"color:#B7C0BB;font-weight:800;font-size:13px\">→<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;line-height:1.2;background:#fff;color:#37424C;border:1px solid #E1E6E3\">Đóng ticket<\u002Fspan><span style=\"color:#B7C0BB;font-weight:800;font-size:13px\">→<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;line-height:1.2;background:#F2FBF5;color:#157A40;border:1px solid #CDE9D6;font-weight:800\">Khảo sát CSAT<\u002Fspan><\u002Fdiv><figcaption style=\"font-size:11.5px;color:#8A93A0;margin-top:11px;letter-spacing:.02em\">Luồng 8.5 · Đa kênh vào → AI định tuyến → SLA → xử lý / escalate → CSAT<\u002Ffigcaption><\u002Ffigure>\n\n\n\n<h3 style=\"font-size:16px;font-weight:700;margin:20px 0 7px\">8.6 Marketing &amp; Broadcast<\u002Fh3><p style=\"font-size:14px;line-height:1.7;color:#37424C;margin:0 0 8px\">Trung tâm <strong>chiến dịch gửi hàng loạt đa kênh<\u002Fstrong> và automation marketing. Chọn tệp khách theo phân khúc động từ CRM hoặc upload Excel, soạn nội dung có AI hỗ trợ, gửi và đo hiệu quả theo thời gian thực.<\u002Fp><ul style=\"margin:2px 0 14px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 26px\"><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Kênh gửi: <strong>Zalo ZNS / ZBS, Email, SMS<\u002Fstrong><\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Chọn đối tượng theo <strong>phân khúc<\u002Fstrong> hoặc upload danh sách<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Soạn nội dung với <strong>AI hỗ trợ<\u002Fstrong>, cá nhân hoá biến<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>A/B test<\u002Fstrong> nội dung &amp; tiêu đề<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Lên lịch gửi<\u002Fstrong> hoặc kích hoạt theo automation<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Báo cáo <strong>tỉ lệ gửi / mở / click<\u002Fstrong>, chi tiết chiến dịch<\u002Fli><\u002Ful><div class=\"keep\" style=\"border:1px solid #F2D9A8;background:#FFF8EC;border-radius:9px;padding:9px 13px;margin:0 0 14px;font-size:12.5px;color:#6B5418;line-height:1.55\"><strong style=\"color:#8A5A0C\">Quy tắc nghiệp vụ · <\u002Fstrong>Chi phí gửi (ZNS/SMS/Email) trừ vào Ví Credit theo đơn giá kênh; chiến dịch tôn trọng trạng thái opt-out của khách và giới hạn tần suất gửi. Nút Trợ lý AI · Marketing thu nhỏ hỗ trợ tạo chiến dịch bằng hội thoại.<\u002Fdiv><h3 style=\"font-size:16px;font-weight:700;margin:20px 0 7px\">8.7 Lịch hẹn<\u002Fh3><p style=\"font-size:14px;line-height:1.7;color:#37424C;margin:0 0 8px\">Quản lý toàn bộ <strong>lịch hẹn dịch vụ và phân công đội ngũ<\u002Fstrong> trên một lịch dùng chung. Lịch hẹn được tạo trực tiếp từ hộp thư, từ widget website, hoặc do nhân viên/AI đặt; mỗi lịch gắn với khách hàng, dịch vụ, nhân sự phụ trách và chi nhánh.<\u002Fp><ul style=\"margin:2px 0 14px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 26px\"><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Xem theo <strong>tuần / tháng<\u002Fstrong>, chuyển nhanh dạng danh sách &amp; kanban theo trạng thái<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Form tạo lịch có <strong>AI gợi ý khung giờ trống<\u002Fstrong> phù hợp, tránh trùng lịch nhân sự<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Gán nhân viên / phòng ban phụ trách, lọc lịch theo phòng ban<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Nhắc hẹn <strong>đa kênh<\u002Fstrong> (Zalo / SMS / Email) trước giờ hẹn, giảm no-show<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Cập nhật trạng thái: chờ xác nhận → đã xác nhận → hoàn thành / huỷ / vắng<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Nút <strong>Trợ lý AI · Lịch hẹn<\u002Fstrong> thu nhỏ để đặt &amp; sắp lịch bằng hội thoại<\u002Fli><\u002Ful><div class=\"keep\" style=\"border:1px solid #F2D9A8;background:#FFF8EC;border-radius:9px;padding:9px 13px;margin:0 0 14px;font-size:12.5px;color:#6B5418;line-height:1.55\"><strong style=\"color:#8A5A0C\">Quy tắc nghiệp vụ · <\u002Fstrong>Một khung giờ không nhận hai lịch cho cùng nhân sự; AI ưu tiên gợi ý slot theo tải công việc và giờ làm việc của chi nhánh. Lịch quá hạn chưa xử lý tự đẩy vào \"Cần follow hôm nay\" ở Dashboard.<\u002Fdiv><h3 style=\"font-size:16px;font-weight:700;margin:20px 0 7px\">8.8 Gọi điện (Call Center)<\u002Fh3><p style=\"font-size:14px;line-height:1.7;color:#37424C;margin:0 0 8px\"><strong>Tổng đài thoại tích hợp AI Voice<\u002Fstrong> ngay trong nền tảng. Gọi ra một chạm từ hồ sơ khách hoặc topbar, nhận cuộc gọi vào qua IVR &amp; hàng đợi, ghi âm và bóc băng tự động để tra soát.<\u002Fp><ul style=\"margin:2px 0 14px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 26px\"><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Gọi ra hiện <strong>widget gọi<\u002Fstrong> trên topbar, gắn với hồ sơ 360°<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>IVR<\u002Fstrong> phân luồng &amp; <strong>hàng đợi<\u002Fstrong> theo nhóm trực<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Ghi âm + transcript<\u002Fstrong>, nghe lại kèm dịch tiếng Việt<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>AI Voice Agent<\u002Fstrong> trực tổng đài, trả lời &amp; định tuyến<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Máy nhánh (extension) đa thiết bị: web phone, IP phone, mobile<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Cấu hình hotline, IVR, hàng đợi, ca trực ở Cài đặt<\u002Fli><\u002Ful><div class=\"keep\" style=\"border:1px solid #F2D9A8;background:#FFF8EC;border-radius:9px;padding:9px 13px;margin:0 0 14px;font-size:12.5px;color:#6B5418;line-height:1.55\"><strong style=\"color:#8A5A0C\">Quy tắc nghiệp vụ · <\u002Fstrong>Cuộc gọi và phút AI Voice tính cước theo Ví Credit; ghi âm lưu theo chính sách bảo mật tenant. Cuộc gọi nhỡ / vượt hàng đợi tạo ticket hoặc nhiệm vụ follow tự động.<\u002Fdiv><h3 style=\"font-size:16px;font-weight:700;margin:20px 0 7px\">8.9 AI Agents<\u002Fh3><p style=\"font-size:14px;line-height:1.7;color:#37424C;margin:0 0 8px\">Xây dựng và vận hành <strong>đội ngũ nhân viên AI<\u002Fstrong> làm việc song song với nhân sự thật. Mỗi agent là một cấu hình độc lập có vai trò, kênh phụ trách và bộ công cụ riêng; hoạt động 24/7, tự xử lý phần lớn hội thoại và chỉ chuyển giao cho người khi cần.<\u002Fp><ul style=\"margin:2px 0 14px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 26px\"><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Danh sách agent với trạng thái <strong>bật / tắt<\u002Fstrong> và chỉ số hiệu suất<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Tạo / cấu hình: <strong>vai trò, model AI, prompt hệ thống<\u002Fstrong><\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Gắn <strong>công cụ / function<\u002Fstrong> (tra cứu, tạo báo giá, đặt lịch, tạo ticket…)<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Định tuyến theo kênh (routing) và phạm vi phụ trách<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Đặt <strong>ngưỡng chuyển giao<\u002Fstrong> (độ tin cậy / rủi ro) sang nhân sự<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan>Đo hiệu suất agent <strong>ngang hàng nhân viên<\u002Fstrong>: hội thoại, tỉ lệ chốt, CSAT<\u002Fli><\u002Ful><div class=\"keep\" style=\"border:1px solid #F2D9A8;background:#FFF8EC;border-radius:9px;padding:9px 13px;margin:0 0 14px;font-size:12.5px;color:#6B5418;line-height:1.55\"><strong style=\"color:#8A5A0C\">Quy tắc nghiệp vụ · <\u002Fstrong>Khi độ tin cậy dưới ngưỡng hoặc phát hiện rủi ro, agent dừng và chuyển giao kèm tóm tắt hội thoại; mọi hành động của agent đều ghi log và có thể hoàn tác (xem Chương 7 · Human-in-the-loop).<\u002Fdiv><h3 style=\"font-size:16px;font-weight:700;margin:20px 0 7px\">8.10 Quy trình (Workflow)<\u002Fh3><p style=\"font-size:14px;line-height:1.7;color:#37424C;margin:0 0 8px\">Trình <strong>dựng tự động hoá kéo-thả<\u002Fstrong> để số hoá các quy trình chăm sóc, bán hàng và vận hành mà không cần lập trình. Mỗi quy trình khởi đầu bằng một <strong>Trigger<\u002Fstrong> (sự kiện) và chạy qua chuỗi node có điều kiện rẽ nhánh.<\u002Fp><ul style=\"margin:2px 0 14px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 26px\"><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Gửi tin nhắn<\u002Fstrong> — nhắn tự động qua kênh của khách<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Đặt câu hỏi<\u002Fstrong> — thu thập thông tin đầu vào<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Giao cho<\u002Fstrong> — chuyển việc cho nhân sự / agent<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Chi nhánh (điều kiện)<\u002Fstrong> — rẽ nhánh theo dữ liệu<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Cập nhật liên hệ / thẻ<\u002Fstrong> — ghi dữ liệu vào CRM<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Chờ<\u002Fstrong> — trì hoãn theo thời gian<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>AI Agent<\u002Fstrong> — gọi agent xử lý một bước<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Mục tiêu<\u002Fstrong> — đánh dấu hoàn thành &amp; đo chuyển đổi<\u002Fli><\u002Ful><div class=\"keep\" style=\"border:1px solid #F2D9A8;background:#FFF8EC;border-radius:9px;padding:9px 13px;margin:0 0 14px;font-size:12.5px;color:#6B5418;line-height:1.55\"><strong style=\"color:#8A5A0C\">Quy tắc nghiệp vụ · <\u002Fstrong>9 loại node dựng thành sơ đồ; bảng thuộc tính cấu hình từng bước. Quy trình chạy theo tenant, tôn trọng phân quyền và guardrail; có thể bật/tắt và theo dõi số lượt chạy, tỉ lệ đạt Mục tiêu.<\u002Fdiv><h3 style=\"font-size:16px;font-weight:700;margin:20px 0 7px\">8.11 Báo cáo<\u002Fh3><p style=\"font-size:14px;line-height:1.7;color:#37424C;margin:0 0 8px\">Hệ thống <strong>báo cáo &amp; phân tích<\u002Fstrong> đa chiều, mỗi chủ đề là một trang độc lập dùng chung bộ lọc thời gian và có thể xuất / lên lịch gửi định kỳ.<\u002Fp><ul style=\"margin:2px 0 14px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 26px\"><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Executive<\u002Fstrong> — bức tranh tổng thể KPI<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Conversations<\u002Fstrong> — hội thoại &amp; kênh<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Tickets &amp; SLA<\u002Fstrong> — hỗ trợ &amp; cam kết<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Channels<\u002Fstrong> — hiệu quả từng kênh<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Marketing<\u002Fstrong> — chiến dịch &amp; chuyển đổi<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Sales &amp; CRM<\u002Fstrong> — pipeline &amp; doanh thu<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>Customers<\u002Fstrong> — tăng trưởng &amp; giữ chân<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:2px;background:#2DC56A\"><\u002Fspan><strong>AI Agents<\u002Fstrong> — hiệu suất agent<\u002Fli><li style=\"font-size:12.8px;color:#455059;line-height:1.55;padding-left:16px;position:relative\"><span style=\"position:absolute;left:0;top:6px;width:6px;height:6px;bord 470;line-height:1.6\">Tạo workspace → chọn ngôn ngữ → mời thành viên → kết nối kênh đầu tiên → hoàn tất onboarding.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-radius:10px;padding:12px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;color:#157A40;margin-bottom:3px\">2. Kết nối kênh đa kênh<\u002Fdiv><div style=\"font-size:13px;color:#5A6470;line-height:1.6\">Chọn kênh (Zalo/Facebook/WhatsApp/Web…) → xác thực OAuth/API → đồng bộ hội thoại &amp; danh bạ → theo dõi sức khoẻ kênh.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-radius:10px;padding:12px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;color:#157A40;margin-bottom:3px\">3. Hội thoại → AI xử lý → Human-in-the-loop<\u002Fdiv><div style=\"font-size:13px;color:#5A6470;line-height:1.6\">Tin nhắn vào inbox → AI phân loại &amp; trả lời tự động → khi vượt ngưỡng / khiếu nại → chuyển giao nhân viên (kèm tóm tắt ngữ cảnh).<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-radius:10px;padding:12px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;color:#157A40;margin-bottom:3px\">4. Bán hàng: Lead → Báo giá → Hợp đồng → Đơn hàng<\u002Fdiv><div style=\"font-size:13px;color:#5A6470;line-height:1.6\">Chọn sản phẩm/dịch vụ (variant, hậu mãi) → báo giá &amp; duyệt → ký hợp đồng số → tạo đơn &amp; thanh toán → cập nhật pipeline.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-radius:10px;padding:12px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;color:#157A40;margin-bottom:3px\">5. CSKH: Tạo ticket → SLA → Giải quyết<\u002Fdiv><div style=\"font-size:13px;color:#5A6470;line-height:1.6\">Tạo ticket (thủ công/AI) → gán &amp; đếm ngược SLA → xử lý bằng macro → khảo sát CSAT → đóng ticket.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-radius:10px;padding:12px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;color:#157A40;margin-bottom:3px\">6. Chiến dịch Broadcast Marketing<\u002Fdiv><div style=\"font-size:13px;color:#5A6470;line-height:1.6\">Chọn kênh &amp; tệp khách (phân khúc/upload) → soạn nội dung (AI) → A/B test → lên lịch gửi → đo mở/click/chuyển đổi.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-radius:10px;padding:12px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;color:#157A40;margin-bottom:3px\">7. Nạp ví / Nâng cấp gói (QR Payment)<\u002Fdiv><div style=\"font-size:13px;color:#5A6470;line-height:1.6\">Chọn gói / gói Credit → tạo Order → sinh QR động → thanh toán → xác nhận / huỷ → cập nhật số dư &amp; hoá đơn.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-radius:10px;padding:12px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;color:#157A40;margin-bottom:3px\">8. Đặt lịch hẹn<\u002Fdiv><div style=\"font-size:13px;color:#5A6470;line-height:1.6\">Tạo lịch (AI gợi ý slot) → phân công phụ trách → nhắc nhở đa kênh → hoàn tất &amp; ghi nhận kết quả.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<h3 class=\"pgbreak\" style=\"font-size:16px;font-weight:700;margin:22px 0 8px;padding-top:8px\">8.15 Danh mục Cài đặt &amp; quản trị (40 trang · chức năng)<\u002Fh3>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">Trung tâm quản trị chia <strong>9 nhóm<\u002Fstrong>. Mỗi trang là một màn hình cấu hình độc lập, phân quyền theo vai trò.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:12px;margin:0 0 8px\">\n\n  <div style=\"border:1px solid #E1E6E3;border-radius:11px;overflow:hidden\" class=\"keep\">\n    <div style=\"background:#F4F7F5;padding:8px 15px;font-size:12px;font-weight:800;color:#157A40;text-transform:uppercase;letter-spacing:.04em\">Workspace &amp; Người dùng<\u002Fdiv>\n    <div style=\"padding:11px 15px;font-size:13px;line-height:1.9;color:#37424C\">\n      <div><strong>Tổng quan<\u002Fstrong> — thông tin workspace, logo, múi giờ, gói hiện tại<\u002F nd:#F4F7F5;padding:8px 15px;font-size:12px;font-weight:800;color:#157A40;text-transform:uppercase;letter-spacing:.04em\">Ứng dụng · Bảo mật · Tài chính<\u002Fdiv>\n    <div style=\"padding:11px 15px;font-size:13px;line-height:1.9;color:#37424C\">\n      <div><strong>Tích hợp<\u002Fstrong> — Google Sheets, Misa, KiotViet, Sapo, Haravan, WooCommerce, Odoo, Brevo… (list &amp; kanban)<\u002Fdiv>\n      <div><strong>API &amp; Webhooks · API Playground · Developer tools<\u002Fstrong> — khoá API, console request/response, tài liệu<\u002Fdiv>\n      <div><strong>Bảo mật · SSO &amp; 2FA · Audit log · Data &amp; Compliance<\u002Fstrong> — chính sách mật khẩu, đăng nhập, nhật ký, tuân thủ<\u002Fdiv>\n      <div><strong>Thông báo<\u002Fstrong> — cấu hình cảnh báo &amp; kênh nhận<\u002Fdiv>\n      <div><strong>Ví AppChat<\u002Fstrong> — số dư credit, nạp tiền, lịch sử ví, hoá đơn<\u002Fdiv>\n      <div><strong>Đối tác tiếp thị<\u002Fstrong> — chương trình affiliate, link giới thiệu, hoa hồng<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<h3 class=\"pgbreak\" style=\"font-size:16px;font-weight:700;margin:22px 0 8px;padding-top:8px\">8.16 Module tài chính &amp; tăng trưởng<\u002Fh3>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">Nhóm chức năng thương mại hoá vận hành trên cơ chế <strong>Ví Credit<\u002Fstrong> &amp; thanh toán QR động.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:0 0 8px\">\n  <div style=\"border:1px solid #E1E6E3;border-left:4px solid #2DC56A;border-radius:10px;padding:12px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;margin-bottom:3px\">Ví AppChat (Credit)<\u002Fdiv><div style=\"font-size:12.5px;color:#5A6470;line-height:1.6\">Nạp theo gói · nạp Credit (quy đổi token AI) · mua thêm tính năng (Email/SMS/ZBS/Google Sheet/Cloud/Đào tạo) · mua tài nguyên (user tổng đài, thêm kênh). Tab: Lịch sử ví · Hoá đơn.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-left:4px solid #2A6FDB;border-radius:10px;padding:12px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;margin-bottom:3px\">Nâng cấp gói<\u002Fdiv><div style=\"font-size:12.5px;color:#5A6470;line-height:1.6\">Popup bảng giá 2 tab Cá nhân/Doanh nghiệp · so sánh chi tiết theo nhóm chức năng · thu gọn/mở rộng · ngân sách token.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-left:4px solid #C9820B;border-radius:10px;padding:12px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;margin-bottom:3px\">Thanh toán QR động<\u002Fdiv><div style=\"font-size:12.5px;color:#5A6470;line-height:1.6\">Tạo Order → sinh QR + thông tin chuyển khoản → xác nhận hoàn thành / huỷ → cập nhật số dư &amp; hoá đơn.<\u002Fdiv><\u002Fdiv>\n  <div style=\"border:1px solid #E1E6E3;border-left:4px solid #6E48E6;border-radius:10px;padding:12px 15px\" class=\"keep\"><div style=\"font-size:13.5px;font-weight:700;margin-bottom:3px\">Đối tác tiếp thị (Affiliate)<\u002Fdiv><div style=\"font-size:12.5px;color:#5A6470;line-height:1.6\">Link giới thiệu · theo dõi lượt &amp; chuyển đổi · hoa hồng · đối soát.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 9 DATA -->\n<h2 class=\"pgbreak\" style=\"font-size:23px;font-weight:800;letter-spacing:-.01em;margin:36px 0 6px;padding-top:8px\">9. Mô hình dữ liệu<\u002Fh2>\n<div style=\"height:3px;width:46px;background:#2DC56A;border-radius:2px;margin-bottom:18px\"><\u002Fdiv>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 14px\">Các thực thể nghiệp vụ chính và quan hệ được thể hiện trong sơ đồ ER. Mọi thực thể mang <span class=\"mono\" style=\"font-size:13px\">tenant_id<\u002Fspan>. Dữ liệu khách hàng là trung tâm, kết nối tới hội thoại, ticket, báo giá/đơn, điểm loyalty.<\u002Fp>\n<figure style=\"border:1px solid #E1E6E3;border-radius:12px;padding:20px 20px 16px;margin:10px 0 16px;background:#FCFDFC\" class=\"keep\">\n  <figcaption style=\"font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9CA3AF;margin-bottom:6px\">Sơ đồ thực thể quan hệ (rút gọn)<\u002Ffigcaption>\n  <div style=\"font-size:11.5px;color:#9CA3AF;margin-bottom:14px\">Mọi thực thể mang <span style=\"font-family:ui-monospace,monospace;font-size:11px\">tenant_id<\u002Fspan> + row-level security. Khách hàng (Contact) là trung tâm.<\u002Fdiv>\n  <div style=\"display:flex;justify-content:center;margin-bottom:8px\"><div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#0F172A;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Tenant (Workspace)<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">id · tên · gói · cấu hình<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"text-align:center;color:#B7C0BB;font-size:14px;line-height:1;margin:1px 0 4px\">▼<\u002Fdiv>\n  <div style=\"display:flex;justify-content:center;margin-bottom:8px\"><div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#2DC56A;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Khách hàng · Contact (CDP)<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">id · tên · kênh · phân khúc · điểm · custom fields<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"text-align:center;color:#B7C0BB;font-size:13px;margin:2px 0 6px\">─ liên kết 1—n ─<\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;justify-content:center\">\n    <div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#2A6FDB;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Hội thoại<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">kênh · trạng thái · phụ trách<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#E8602C;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Ticket<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">SLA · ưu tiên · CSAT<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#157A40;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Báo giá<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">sản phẩm · variant · duyệt<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#0E7C6B;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Đơn hàng<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">item · thanh toán<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#6E48E6;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Hợp đồng<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">ký số · hiệu lực<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#C9820B;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Lịch hẹn<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">thời gian · phụ trách<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#DB2777;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Điểm Loyalty<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">cộng/trừ · hạng<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#8A5A0C;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Chiến dịch<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">kênh · tệp KH<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"text-align:center;color:#B7C0BB;font-size:13px;margin:8px 0 6px\">Tài chính &amp; quản trị<\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;justify-content:center\">\n    <div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#0B4F8A;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Ví · Credit<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">số dư · quy đổi token<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#6B7280;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Giao dịch<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">order · QR · trạng thái<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#374151;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Người dùng · Vai trò<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">RBAC · phòng ban<\u002Fdiv><\u002Fdiv>\n    <div style=\"border:1px solid #E1E6E3;border-radius:9px;overflow:hidden;min-width:132px\"><div style=\"background:#16A34A;color:#fff;font-size:12px;font-weight:800;padding:6px 10px\">Sản phẩm/Dịch vụ<\u002Fdiv><div style=\"padding:7px 10px;font-size:11px;color:#5A6470;line-height:1.6\">variant · giá · kênh<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffigure>\n\n<!-- 10 API -->\n<h2 class=\"pgbreak\" style=\"font-size:23px;font-weight:800;letter-spacing:-.01em;margin:36px 0 6px;padding-top:8px\">10. Thiết kế API &amp; tích hợp<\u002Fh2>\n<div style=\"height:3px;width:46px;background:#2DC56A;border-radius:2px;margin-bottom:18px\"><\u002Fdiv>\n<h3 style=\"font-size:16px;font-weight:700;margin:18px 0 8px\">10.1 Nguyên tắc API<\u002Fh3>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">API tài nguyên hoá theo REST, định danh nhất quán, phân trang &amp; lọc chuẩn hoá, versioning qua đường dẫn. Webhook ra thông báo sự kiện cho bên thứ ba; webhook vào tiếp nhận tin nhắn kênh và biến cố thanh toán. Có API Playground để thử nghiệm request/response.<\u002Fp>\n<h3 style=\"font-size:16px;font-weight:700;margin:18px 0 8px\">10.2 Kết nối kênh (OAuth + Webhook)<\u002Fh3>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">Kết nối kênh mạng xã hội theo OAuth: cấp quyền, đổi mã lấy access token, đăng ký webhook, đồng bộ hội thoại về Inbox.<\u002Fp>\n<figure style=\"border:1px solid #E1E6E3;border-radius:12px;padding:18px 18px 14px;margin:10px 0 16px;background:#FCFDFC\" class=\"keep\"><figcaption style=\"font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9CA3AF;margin-bottom:13px\">Luồng kết nối kênh (OAuth + Webhook)<\u002Ffigcaption><div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #2A6FDB;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#2A6FDB;font-weight:800\">1.<\u002Fspan> Chọn kênh cần kết nối<\u002Fdiv><div style=\"color:#B7C0BB;font-size:15px\">→<\u002Fdiv><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #2A6FDB;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#2A6FDB;font-weight:800\">2.<\u002Fspan> Cấp quyền OAuth<\u002Fdiv><div style=\"color:#B7C0BB;font-size:15px\">→<\u002Fdiv><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #2A6FDB;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#2A6FDB;font-weight:800\">3.<\u002Fspan> Đổi code lấy access token<\u002Fdiv><div style=\"color:#B7C0BB;font-size:15px\">→<\u002Fdiv><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #2A6FDB;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#2A6FDB;font-weight:800\">4.<\u002Fspan> Đăng ký webhook<\u002Fdiv><div style=\"color:#B7C0BB;font-size:15px\">→<\u002Fdiv><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #2A6FDB;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#2A6FDB;font-weight:800\">5.<\u002Fspan> Đồng bộ hội thoại &amp; danh bạ<\u002Fdiv><div style=\"color:#B7C0BB;font-size:15px\">→<\u002Fdiv><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #2A6FDB;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#2A6FDB;font-weight:800\">6.<\u002Fspan> Theo dõi sức khoẻ kênh<\u002Fdiv><\u002Fdiv><\u002Ffigure>\n<h3 style=\"font-size:16px;font-weight:700;margin:18px 0 8px\">10.3 Thanh toán &amp; nạp ví (VietQR)<\u002Fh3>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">Nạp ví sinh mã VietQR động; sau khi khách chuyển khoản, cổng thanh toán/ngân hàng gửi webhook xác nhận, hệ thống đối soát theo mã đơn rồi cộng số dư và xuất biên nhận.<\u002Fp>\n<figure style=\"border:1px solid #E1E6E3;border-radius:12px;padding:18px 18px 14px;margin:10px 0 16px;background:#FCFDFC\" class=\"keep\"><figcaption style=\"font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9CA3AF;margin-bottom:13px\">Luồng thanh toán / nạp ví (VietQR động)<\u002Ffigcaption><div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #157A40;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#157A40;font-weight:800\">1.<\u002Fspan> Chọn gói / nạp Credit<\u002Fdiv><div style=\"color:#B7C0BB;font-size:15px\">→<\u002Fdiv><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #157A40;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#157A40;font-weight:800\">2.<\u002Fspan> Hệ thống tạo Order<\u002Fdiv><div style=\"color:#B7C0BB;font-size:15px\">→<\u002Fdiv><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #157A40;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#157A40;font-weight:800\">3.<\u002Fspan> Sinh mã VietQR động<\u002Fdiv><div style=\"color:#B7C0BB;font-size:15px\">→<\u002Fdiv><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #157A40;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#157A40;font-weight:800\">4.<\u002Fspan> Khách chuyển khoản<\u002Fdiv><div style=\"color:#B7C0BB;font-size:15px\">→<\u002Fdiv><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #157A40;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#157A40;font-weight:800\">5.<\u002Fspan> Webhook NH xác nhận<\u002Fdiv><div style=\"color:#B7C0BB;font-size:15px\">→<\u002Fdiv><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #157A40;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#157A40;font-weight:800\">6.<\u002Fspan> Cộng số dư / kích hoạt<\u002Fdiv><div style=\"color:#B7C0BB;font-size:15px\">→<\u002Fdiv><div style=\"flex-shrink:0;width:132px;border:1px solid #E1E6E3;border-left:3px solid #157A40;border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;font-weight:600;color:#37424C\"><span style=\"color:#157A40;font-weight:800\">7.<\u002Fspan> Xuất hoá đơn<\u002Fdiv><\u002Fdiv><\u002Ffigure>\n<h3 style=\"font-size:16px;font-weight:700;margin:18px 0 8px\">10.4 Hệ sinh thái tích hợp<\u002Fh3>\n<p style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px\">Google Sheets, Email (Brevo/Mailgun/SendGrid/Amazon SES, Google Workspace/Gmail SMTP), Zalo ZBS, MISA, KiotViet, Sapo, Haravan, WooCommerce, Odoo, Fast, cloud storage (S3), telco SMS. Mỗi tích hợp có luồng onboard riêng, lưu cấu hình theo tenant.<\u002Fp>\n\n<!-- 11 SECURITY -->\n<h2 style=\"font-size:23px;font-weight:800;letter-spacing:-.01em;margin:36px 0 6px;padding-top:8px\">11. Bảo mật &amp; phân quyền<\u002Fh2>\n<div style=\"height:3px;width:46px;background:#2DC56A;border-radius:2px;margin-bottom:18px\"><\u002Fdiv>\n<ul style=\"font-size:14.5px;line-height:1.7;color:#37424C;margin:0 0 12px;padding-left:20px\">\n  <li><strong>Xác thực<\u002Fstrong>: email/mật khẩu, SSO, OTP/2FA; phiên có thời hạn và refresh token.<\u002Fli>\n  <li><strong>Phân quyền (RBAC)<\u002Fstrong>: vai trò &amp; nhóm quyền gán cho thành viên, bám sát toàn bộ menu/submenu; quyền hiển thị trường dữ liệu theo vai trò.<\u002Fli>\n  <li><strong>Cô lập tenant<\u002Fstrong>: cưỡng chế <span class=\"mono\" style=\"font-size:13px\">tenant_id<\u002Fspan> ở tầng dữ liệu, chống rò rỉ chéo.<\u002Fli>\n  <li><strong>Mã hoá<\u002Fstrong>: TLS khi truyền, mã hoá at-rest cho dữ liệu nhạy cảm và token kênh.<\u002Fli>\n  <li><strong>Nhật ký &amp; truy vết<\u002Fstrong>: audit log thao tác người dùng &amp; AI; AI Governance giám sát hành động tự động.<\u002Fli>\n<\u002Ful>\n\n<!-- 12 NFR -->\n<h2 style=\"font-size:23px;font-weight:800;letter-spacing:-.01em;margin:36px 0 6px;padding-top:8px\">12. Yêu cầu phi chức năng<\u002Fh2>\n<div style=\"height:3px;w
