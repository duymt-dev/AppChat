<script type="text/babel">
const { useState, useEffect } = React;

/* ============================================================
   Resilience helpers — never let one missing piece whitescreen the app
   ============================================================ */

// SafeIcon: renders a placeholder square if Icon.<name> is missing
const SafeIcon = ({ name, ...rest }) => {
  const C = window.Icon && window.Icon[name];
  if (typeof C === 'function') return <C {...rest}/>;
  // tiny fallback dot so dev sees something is missing without crashing
  return (
    <svg viewBox="0 0 24 24" {...rest} style={{ ...(rest.style||{}), opacity: 0.4 }}>
      <rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" strokeWidth="1.6" strokeDasharray="3 3"/>
    </svg>
  );
};

// SafeMod: lookup a module component by name; auto-retry until it's defined
// (external Babel scripts transform asynchronously, so a module may be undefined
//  on the first render — poll instead of forcing a manual reload).
const SafeMod = ({ name }) => {
  const [, force] = React.useState(0);
  const [timedOut, setTimedOut] = React.useState(false);
  const C = window[name];
  React.useEffect(() => {
    if (typeof window[name] === 'function') return;
    let n = 0;
    const id = setInterval(() => {
      n++;
      if (typeof window[name] === 'function') { clearInterval(id); force(v => v + 1); }
      else if (n > 150) { clearInterval(id); setTimedOut(true); }
    }, 100);
    return () => clearInterval(id);
  }, [name]);
  if (typeof C === 'function') return <C/>;
  if (timedOut) return (
    <div style={{padding:36, color:'var(--label-02, #6B7280)'}}>
      <h2 style={{margin:'0 0 6px'}}>Module mất nhiều thời gian để tải</h2>
      <p style={{margin:'0 0 14px'}}>Component <b>{name}</b> chưa sẵn sàng (mạng chậm hoặc script chưa tải xong).</p>
      <button onClick={() => { setTimedOut(false); force(v => v + 1); }} style={{padding:'8px 14px', borderRadius:6, border:'1px solid #d1d5db', background:'white', cursor:'pointer', fontWeight:600}}>Thử lại</button>
    </div>
  );
  return (
    <div style={{padding:36, color:'var(--label-02, #6B7280)', display:'flex', alignItems:'center', gap:12}}>
      <span style={{width:18, height:18, border:'2px solid #d1d5db', borderTopColor:'#2DC56A', borderRadius:'50%', display:'inline-block', animation:'sm-spin .7s linear infinite'}}></span>
      <span>Đang tải module <b>{name}</b>…</span>
      <style>{'@keyframes sm-spin{to{transform:rotate(360deg)}}'}</style>
    </div>
  );
};

// ErrorBoundary: catches render-time crashes inside any module so the rail
// + other modules keep working. Click "Thử lại" to retry.
class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err){ return { err }; }
  componentDidCatch(err, info){ console.error('[Module crash]', err, info); }
  reset = () => this.setState({ err: null });
  componentDidUpdate(prev){ if (prev.resetKey !== this.props.resetKey && this.state.err) this.reset(); }
  render(){
    if (this.state.err) {
      return (
        <div style={{padding:36, maxWidth:640}}>
          <h2 style={{margin:'0 0 8px', color:'var(--risk, #DC2626)'}}>Module này gặp lỗi</h2>
          <p style={{color:'var(--label-02, #6B7280)', margin:'0 0 16px'}}>
            Một thành phần bên trong module bị crash. Các module khác vẫn dùng được — chuyển sang module khác hoặc bấm Thử lại.
          </p>
          <pre style={{background:'#f9fafb', padding:12, borderRadius:8, fontSize:12, overflow:'auto', maxHeight:200, color:'#374151', border:'1px solid #e5e7eb'}}>{String(this.state.err && this.state.err.message || this.state.err)}</pre>
          <button onClick={this.reset} style={{marginTop:14, padding:'8px 14px', borderRadius:6, border:'1px solid #d1d5db', background:'white', cursor:'pointer', fontWeight:500}}>Thử lại</button>
        </div>
      );
    }
    return this.props.children;
  }
}

  const [authed, setAuthed] = useState(() => localStorage.getItem('ac_authed') === '1');
  const [active, setActive] = useState(() => localStorage.getItem('ac_module') || 'messages');
  const [channelOpen, setChannelOpen] = useState(false);
  const [userOpen, setUserOpen] = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);
  const [helpOpen, setHelpOpen] = useState(false);
  const [repOpen, setRepOpen] = useState(false);
  const [repTop, setRepTop] = useState(0);
  const [cusOpen, setCusOpen] = useState(false);
  const [omiOpen, setOmiOpen] = useState(false);
  const [curWs, setCurWs] = useState('personal');
  const [cusTop, setCusTop] = useState(0);
  useEffect(() => { localStorage.setItem('ac_module', active); }, [active]);
  useEffect(() => { localStorage.setItem('ac_authed', authed ? '1' : '0'); }, [authed]);

    window.acNavigate = (mod, sub) => { if (sub) localStorage.setItem('ac_settings', sub); setActive(mod); };
    window.acOpenChannel = () => setChannelOpen(true);
    window.__acGo = (k) => setActive(k);
  }, []);
  const Mod = MODULES.find(m=>m.k===active) || MODULES[0];

  if (!authed) return <AuthRouter onLogin={()=>setAuthed(true)}/>;

  return (
    <div className="app">
      <aside className="rail">
        <div className="rail-logo" title="AppChat">
          <img src={(window.__resources&&window.__resources.symbol)||"assets/symbol.png"} alt="AppChat"/>
        </div>
        {MODULES.filter(m=>!m.hidden && !m.railHidden).map(m => {
          if (m.k==='omi') {
            const items=[{k:'chats', l:'Phiên trò chuyện', icon:'Chat'},{k:'actions', l:'Nhật ký', icon:'Activity'}];

              <div key="omi" style={{position:'relative', width:'100%', display:'flex', justifyContent:'center'}} onMouseEnter={(e)=>{ const r=e.currentTarget.getBoundingClientRect(); setCusTop(r.top); setOmiOpen(true); }} onMouseLeave={()=>setOmiOpen(false)}>

                </button>

                  <div onMouseEnter={()=>setOmiOpen(true)} style={{position:'fixed', left:80, top:cusTop, zIndex:1200, width:208, background:'white', border:'1px solid var(--fill-04)', borderRadius:12, boxShadow:'0 16px 44px rgba(17,24,39,.2)', padding:6}}>

                      <button key={it.k} onClick={()=>{ if(it.k==='quotes'){ setActive('quotes'); } else if(it.k==='contracts'){ setActive('contracts'); } else { setActive(it.k); } setCusOpen(false);}} style={{display:'flex', alignItems:'center', gap:10, width:'100%', padding:'9px 10px', border:'none', borderRadius:8, cursor:'pointer', textAlign:'left', fontFamily:'inherit', fontSize:13, fontWeight: active===it.k?700:500, background: active===it.k?'var(--bg-green)':'transparent', color: active===it.k?'var(--pr-dark-2)':'var(--label-01)'}}
                        onMouseEnter={e=>{ if(active!==it.k) e.currentTarget.style.background='var(--fill-02)'; }} onMouseLeave={e=>{ if(active!==it.k) e.currentTarget.style.background='transparent'; }}>
                        <SafeIcon name={it.icon} style={{width:16, height:16, flexShrink:0, color: active===it.k?'var(--pr-dark-1)':'var(--label-02)'}}/>

              {g:'AI & Tự động hoá', items:[{k:'rep_ai', l:'AI Agents', icon:'Sparkles'},{k:'rep_auto', l:'Automation & Workflow', icon:'Workflow'}]},

              <SafeIcon name={m.icon}/>
              <span className="rail-label">{m.l}</span>
              {m.badge && <span className="rail-badge">{m.badge}</span>}
            </button>

        })}
        <div className="rail-spacer"/>
        <div style={{display:'flex', flexDirection:'column', alignItems:'center', gap:4, marginBottom:8}}>
          <div className="rail-avatar" title="Trâm — Sales Lead" onClick={()=>setUserOpen(o=>!o)} style={{cursor:'pointer', outline: userOpen ? '2px solid var(--primary)' : 'none', outlineOffset:2}}>T</div>
          <button className="rail-foot" title="Cài đặt" onClick={()=>setActive('settings')} style={{background: active==='settings'?'var(--bg-green)':'transparent', color: active==='settings'?'var(--pr-dark-1)':'var(--label-03)'}}><SafeIcon name="Settings" style={{width:19,height:19}}/></button>
          <button className="rail-foot" title="Thông báo" onClick={()=>setNotifOpen(o=>!o)} style={{position:'relative', background: notifOpen?'var(--bg-green)':'transparent', color: notifOpen?'var(--pr-dark-1)':'var(--label-03)'}}><SafeIcon name="Bell" style={{width:19,height:19}}/><span style={{position:'absolute', top:5, right:9, width:7, height:7, borderRadius:4, background:'#E33F3F', border:'2px solid white'}}/></button>
          <button className="rail-foot" title="Trợ giúp" onClick={()=>setHelpOpen(o=>!o)} style={{background: helpOpen?'var(--bg-green)':'transparent', color: helpOpen?'var(--pr-dark-1)':'var(--label-03)'}}><SafeIcon name="Help" style={{width:19,height:19}}/></button>
        </div>
      </aside>

      {notifOpen && <>
        <div onClick={()=>setNotifOpen(false)} style={{position:'fixed', inset:0, zIndex:998}}></div>
        <div style={{position:'fixed', left:84, bottom:14, width:320, background:'white', border:'1px solid var(--fill-04)', borderRadius:14, boxShadow:'0 18px 48px rgba(17,24,39,.2)', zIndex:999, overflow:'hidden'}}>
          <div style={{display:'flex', alignItems:'center', padding:'13px 16px', borderBottom:'1px solid var(--fill-03)'}}>
            <span style={{fontSize:14, fontWeight:800}}>Thông báo</span><span style={{flex:1}}></span>
            <span style={{fontSize:11.5, fontWeight:700, color:'var(--primary)', cursor:'pointer'}}>Đánh dấu đã đọc</span>
          </div>
          <div style={{maxHeight:360, overflowY:'auto'}}>
            {[
              {ic:'Activity', c:'#E8602C', t:'CSKH AI tạo 5 ticket mới', s:'2 phút trước'},
              {ic:'Bell', c:'#DC2626', t:'1 ticket sắp quá hạn SLA', s:'12 phút trước'},
              {ic:'User', c:'#2A6FDB', t:'Sales AI tạo 23 lead mới', s:'30 phút trước'},
              {ic:'Calendar', c:'#0E9B94', t:'18 lịch hẹn được xác nhận', s:'1 giờ trước'},
            ].map((n,i)=>(
              <div key={i} style={{display:'flex', gap:11, padding:'12px 16px', borderBottom:'1px solid var(--fill-03)'}}>
                <span style={{width:32, height:32, borderRadius:9, background:n.c+'18', color:n.c, display:'grid', placeItems:'center', flexShrink:0}}><SafeIcon name={n.ic} style={{width:16,height:16}}/></span>
                <div style={{minWidth:0}}><div style={{fontSize:13, fontWeight:600, color:'var(--label-01)'}}>{n.t}</div><div style={{fontSize:11.5, color:'var(--label-03)'}}>{n.s}</div></div>
              </div>
            ))}
          </div>
        </div>
      </>}

      {helpOpen && <>
        <div onClick={()=>setHelpOpen(false)} style={{position:'fixed', inset:0, zIndex:998}}></div>
        <div style={{position:'fixed', left:84, bottom:14, width:280, background:'white', border:'1px solid var(--fill-04)', borderRadius:14, boxShadow:'0 18px 48px rgba(17,24,39,.2)', zIndex:999, overflow:'hidden'}}>
          <div style={{padding:'13px 16px', borderBottom:'1px solid var(--fill-03)', fontSize:14, fontWeight:800}}>Trợ giúp & Hỗ trợ</div>
          <div style={{padding:6}}>
            {[
              {ic:'Book', t:'Trung tâm trợ giúp'},
              {ic:'MessageSquare', t:'Chat với hỗ trợ'},
              {ic:'Sparkles', t:'Hỏi Trợ lý AI'},
              {ic:'FileText', t:'Tài liệu API'},
            ].map((h,i)=>(
              <button key={i} onClick={()=>setHelpOpen(false)} style={{display:'flex', alignItems:'center', gap:10, width:'100%', padding:'9px 10px', border:'none', background:'transparent', borderRadius:8, fontSize:13, fontWeight:500, color:'var(--label-01)', cursor:'pointer', textAlign:'left', fontFamily:'inherit'}}
                onMouseEnter={e=>e.currentTarget.style.background='var(--fill-02)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                <SafeIcon name={h.ic} style={{width:16, height:16, flexShrink:0, color:'var(--label-02)'}}/> {h.t}
              </button>
            ))}
          </div>
        </div>
      </>}

      {userOpen && <>
        <div onClick={()=>setUserOpen(false)} style={{position:'fixed', inset:0, zIndex:998}}></div>
        <div style={{position:'fixed', left:84, bottom:14, width:264, background:'white', border:'1px solid var(--fill-04)', borderRadius:14, boxShadow:'0 18px 48px rgba(17,24,39,.2)', zIndex:999, overflow:'hidden'}}>
          <div style={{display:'flex', alignItems:'center', gap:11, padding:'14px 14px 12px', borderBottom:'1px solid var(--fill-03)'}}>
            <div style={{width:38, height:38, borderRadius:'50%', background:'var(--grad-signature)', color:'white', display:'grid', placeItems:'center', fontWeight:800, fontSize:15}}>T</div>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontWeight:700, fontSize:13.5}}>Thùy Trâm</div>
              <div style={{fontSize:11.5, color:'var(--label-02)'}}>+84 90 771 1888 · Sales Lead</div>
            </div>
            <span className="chip green" style={{flexShrink:0}}><span className="dot"></span> Trực</span>
          </div>
          {/* Workspace switcher */}
          <div style={{padding:'10px 12px', borderBottom:'1px solid var(--fill-03)', background:'var(--fill-02)'}}>
            <div style={{fontSize:10, fontWeight:800, letterSpacing:'.05em', textTransform:'uppercase', color:'var(--label-03)', marginBottom:7}}>Chuyển workspace</div>
            {[{k:'personal', l:'Trâm · Cá nhân', d:'Gói Cá nhân', c:'#2563EB', ic:'Users'},{k:'team', l:'Spa Hương Sen', d:'Gói Team · 8 thành viên', c:'#0E9B7E', ic:'Users'},{k:'biz', l:'MediaSoft Group', d:'Doanh nghiệp · 42 người', c:'#6E48E6', ic:'Shield'}].map(w=>{ const on=curWs===w.k; return (
              <button key={w.k} onClick={()=>{ setCurWs(w.k); }} style={{display:'flex', alignItems:'center', gap:10, width:'100%', padding:'8px 9px', border:'1px solid '+(on?w.c:'transparent'), borderRadius:9, cursor:'pointer', textAlign:'left', fontFamily:'inherit', marginBottom:4, background:on?w.c+'10':'white'}}
                onMouseEnter={e=>{ if(!on) e.currentTarget.style.background='var(--fill-03)'; }} onMouseLeave={e=>{ if(!on) e.currentTarget.style.background='white'; }}>
                <span style={{width:30,height:30,borderRadius:8,background:w.c+'18',color:w.c,display:'grid',placeItems:'center',flexShrink:0,fontWeight:800,fontSize:13}}>{w.l[0]}</span>
                <span style={{flex:1, minWidth:0}}><span style={{display:'block', fontSize:12.5, fontWeight:700, color:'var(--label-01)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{w.l}</span><span style={{display:'block', fontSize:10.5, color:'var(--label-03)'}}>{w.d}</span></span>
                {on && <SafeIcon name="Check" style={{width:15,height:15,color:w.c,flexShrink:0}}/>}
              </button>
            );})}
            <button onClick={()=>{setUserOpen(false); setActive('settings');}} style={{display:'flex', alignItems:'center', gap:7, width:'100%', padding:'7px 9px', marginTop:2, border:'1px dashed var(--fill-04)', borderRadius:8, cursor:'pointer', fontFamily:'inherit', fontSize:11.5, fontWeight:700, color:'var(--pr-dark-2)', background:'transparent'}}>
              <SafeIcon name="Plus" style={{width:13,height:13}}/> Mua thêm workspace
            </button>
          </div>
          <div style={{padding:6}}>
            <button onClick={()=>setUserOpen(false)} style={{display:'flex', alignItems:'center', gap:9, width:'100%', padding:'9px 10px', border:'none', background:'transparent', borderRadius:8, fontSize:13, fontWeight:600, color:'var(--label-01)', cursor:'pointer', textAlign:'left'}}
              onMouseEnter={e=>e.currentTarget.style.background='var(--fill-02)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <SafeIcon name="Users" style={{width:16, height:16, flexShrink:0, color:'var(--label-02)'}}/> Hồ sơ của tôi
            </button>
            <button onClick={()=>{setUserOpen(false); setActive('settings');}} style={{display:'flex', alignItems:'center', gap:9, width:'100%', padding:'9px 10px', border:'none', background:'transparent', borderRadius:8, fontSize:13, fontWeight:600, color:'var(--label-01)', cursor:'pointer', textAlign:'left'}}
              onMouseEnter={e=>e.currentTarget.style.background='var(--fill-02)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <SafeIcon name="Settings" style={{width:16, height:16, flexShrink:0, color:'var(--label-02)'}}/> Cài đặt tài khoản
            </button>
            <div style={{height:1, background:'var(--fill-03)', margin:'6px 4px'}}></div>
            <button onClick={()=>{setUserOpen(false); setAuthed(false);}} style={{display:'flex', alignItems:'center', gap:9, width:'100%', padding:'9px 10px', border:'none', background:'transparent', borderRadius:8, fontSize:13, fontWeight:600, color:'var(--label-01)', cursor:'pointer', textAlign:'left'}}
              onMouseEnter={e=>e.currentTarget.style.background='var(--fill-02)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <SafeIcon name="Refresh" style={{width:16, height:16, flexShrink:0, color:'var(--label-02)'}}/> Đăng nhập tài khoản khác
            </button>
            <button onClick={()=>{setUserOpen(false); setAuthed(false);}} style={{display:'flex', alignItems:'center', gap:9, width:'100%', padding:'9px 10px', border:'none', background:'transparent', borderRadius:8, fontSize:13, fontWeight:700, color:'var(--error)', cursor:'pointer', textAlign:'left'}}
              onMouseEnter={e=>e.currentTarget.style.background='var(--bg-red, #FDECEA)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <SafeIcon name="ArrowLeft" style={{width:16, height:16, flexShrink:0}}/> Đăng xuất
            </button>
          </div>
        </div>
      </>}
      <main className="module" key={active} data-screen-label={Mod.l}>
        <ErrorBoundary resetKey={active}>
          <SafeMod name={Mod.mod}/>
        </ErrorBoundary>
      </main>
      {channelOpen && <ChannelConnectModal onClose={()=>setChannelOpen(false)} audience="Nhóm Bán Hàng"/>}
      {window.WebPhone ? <window.WebPhone/> : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
requestAnimationFrame(function(){window.__hideBoot && window.__hideBoot();});
</script>
</body>
</html>
